<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seahawk Club Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5F3; --panel:#FFFFFF; --panel-2:#E9EDEA; --panel-3:#DFE5E1;
  --line:#D6DCD8; --line-2:#C2CBC5;
  --ink:#17222B; --ink-2:#4B5A63; --ink-3:#74838B;
  --blue:#14507E; --blue-2:#0E3C5F; --blue-soft:#E2EBF3; --blue-line:#B7CCDE;
  --green:#2A6B57; --green-soft:#DFEBE5; --green-line:#B3CDC1;
  --warn:#8A5312; --warn-soft:#F3E8D8; --warn-line:#DFC9A6;
  --r-s:3px; --r-m:5px; --r-l:7px;
  --nav-h:57px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#12181C; --panel:#1A2228; --panel-2:#222C33; --panel-3:#2B363E;
    --line:#2E3A42; --line-2:#3D4A53;
    --ink:#E6EBEA; --ink-2:#A9B6BC; --ink-3:#83919A;
    --blue:#7FB4DC; --blue-2:#A6CDEA; --blue-soft:#1B2C39; --blue-line:#2F4A5F;
    --green:#79C3A9; --green-soft:#172A25; --green-line:#2C4A41;
    --warn:#D9A961; --warn-soft:#2B2318; --warn-line:#4A3B26;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12181C; --panel:#1A2228; --panel-2:#222C33; --panel-3:#2B363E;
  --line:#2E3A42; --line-2:#3D4A53;
  --ink:#E6EBEA; --ink-2:#A9B6BC; --ink-3:#83919A;
  --blue:#7FB4DC; --blue-2:#A6CDEA; --blue-soft:#1B2C39; --blue-line:#2F4A5F;
  --green:#79C3A9; --green-soft:#172A25; --green-line:#2C4A41;
  --warn:#D9A961; --warn-soft:#2B2318; --warn-line:#4A3B26;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--nav-h) + env(safe-area-inset-top,0px) + 8px)}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Libre Franklin",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-weight:600;margin:0;line-height:1.22;letter-spacing:-.005em}
h1{font-size:30px}h2{font-size:21px}h3{font-size:17px}
p{margin:0 0 .85em}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- chrome ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--panel);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;height:var(--nav-h);display:flex;align-items:center;gap:26px;padding:0 20px}
.wordmark{font-family:"Source Serif 4",Georgia,serif;font-weight:700;font-size:19px;color:var(--ink);letter-spacing:-.015em;white-space:nowrap}
.wordmark:hover{text-decoration:none}
.wordmark .h{color:var(--green)}
.mainnav{display:flex;gap:2px;flex:1}
.mainnav a{position:relative;padding:18px 11px 17px;font-size:14px;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.mainnav a:hover{color:var(--ink);text-decoration:none;background:var(--panel-2)}
.mainnav a.on{color:var(--ink);border-bottom-color:var(--blue);font-weight:600}
.nav-badge{display:inline-block;min-width:17px;height:17px;padding:0 4px;margin-left:6px;border-radius:9px;background:var(--blue);color:#fff;font-size:11px;font-weight:600;line-height:17px;text-align:center;vertical-align:1px}
:root[data-theme="dark"] .nav-badge{color:var(--paper)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nav-badge{color:var(--paper)}}
.avatar{width:31px;height:31px;border-radius:50%;background:var(--green);color:#fff;border:0;display:grid;place-items:center;font-size:13px;font-weight:600;cursor:pointer;flex:none}
:root[data-theme="dark"] .avatar{color:#0F1A16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .avatar{color:#0F1A16}}
.acct{position:relative}
.menu{position:absolute;right:0;top:40px;width:232px;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-l);box-shadow:0 8px 24px rgba(10,20,28,.16);padding:6px;z-index:50}
.menu h4{font-family:inherit;font-size:12px;font-weight:600;color:var(--ink-3);padding:8px 10px 4px;margin:0}
.menu button,.menu a{display:block;width:100%;text-align:left;padding:7px 10px;border:0;background:none;font-size:14px;border-radius:var(--r-s);cursor:pointer;color:var(--ink)}
.menu button:hover,.menu a:hover{background:var(--panel-2);text-decoration:none}
.menu input{width:100%;padding:6px 8px;margin:2px 0 6px;border:1px solid var(--line-2);border-radius:var(--r-s);background:var(--paper);color:var(--ink);font-size:14px}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.botnav{display:none}

.wrap{max-width:1180px;margin:0 auto;padding:26px 20px 64px}
.narrow{max-width:760px}

/* ---------- generic ---------- */
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
.small{font-size:13px}
.xs{font-size:12px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.stack>*+*{margin-top:var(--gap,14px)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sec-head h2{font-size:19px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m)}
.pad{padding:16px 18px}
.crumb{font-size:13px;color:var(--ink-2);margin-bottom:10px;display:inline-block}

.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:var(--r-s);border:1px solid var(--line-2);background:var(--panel);color:var(--ink);font-size:14px;font-weight:500;cursor:pointer;transition:background .12s,border-color .12s;white-space:nowrap}
.btn:hover{background:var(--panel-2);text-decoration:none}
.btn-pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-pri:hover{background:var(--blue-2);border-color:var(--blue-2)}
:root[data-theme="dark"] .btn-pri{color:#0C1A24}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-pri{color:#0C1A24}}
.btn-on{background:var(--green-soft);border-color:var(--green-line);color:var(--green)}
.btn-on:hover{background:var(--green-soft);border-color:var(--green)}
.btn-sm{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:default}
.linkbtn{background:none;border:0;padding:0;color:var(--blue);cursor:pointer;font-size:14px}
.linkbtn:hover{text-decoration:underline}

.chip{display:inline-block;padding:2px 8px;border-radius:var(--r-s);font-size:12px;font-weight:500;background:var(--panel-2);color:var(--ink-2);border:1px solid transparent;white-space:nowrap}
.chip-blue{background:var(--blue-soft);color:var(--blue);border-color:var(--blue-line)}
.chip-green{background:var(--green-soft);color:var(--green);border-color:var(--green-line)}
.chip-warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.meta{font-size:13px;color:var(--ink-2)}
.meta span+span::before{content:"•";margin:0 7px;color:var(--ink-3)}

.field{width:100%;padding:9px 12px;border:1px solid var(--line-2);border-radius:var(--r-s);background:var(--panel);color:var(--ink);font:inherit;font-size:14px}
.field::placeholder{color:var(--ink-3)}
.field:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}

/* ---------- home ---------- */
.intro{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:24px}
.intro h1{font-size:32px;margin-bottom:4px}
.intro .lede{color:var(--ink-2);max-width:60ch;margin-bottom:16px}
.searchrow{display:flex;gap:9px;max-width:620px}
.searchrow .field{flex:1}
.quicklinks{margin-top:12px;font-size:13px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:0 14px;align-items:baseline}
.quicklinks b{font-weight:500;color:var(--ink-3)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 312px;gap:34px;align-items:start}
.aside{display:flex;flex-direction:column;gap:18px}
.aside .panel h3{font-size:16px;margin-bottom:8px}

/* ---------- club rows ---------- */
.clublist{border-top:1px solid var(--line)}
.clubrow{display:block;padding:13px 12px 13px 2px;border-bottom:1px solid var(--line);color:inherit;position:relative}
.clubrow:hover{background:var(--panel);text-decoration:none}
.clubrow-top{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.clubrow-name{font-weight:600;font-size:15.5px;color:var(--ink)}
.clubrow:hover .clubrow-name{color:var(--blue)}
.clubrow-sum{font-size:13.5px;color:var(--ink-2);margin:3px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:78ch}
.clubrow-foot{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.rowact{display:flex;gap:6px;flex:none}
.tagline{font-size:12.5px;color:var(--ink-3)}

/* ---------- directory ---------- */
.dircols{display:grid;grid-template-columns:228px minmax(0,1fr);gap:34px;align-items:start}
.filters{position:sticky;top:calc(var(--nav-h) + env(safe-area-inset-top,0px) + 18px)}
.fgroup{border-bottom:1px solid var(--line);padding:13px 0}
.fgroup:first-child{padding-top:0}
.fgroup h4{font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink);margin:0 0 8px}
.fopt{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;color:var(--ink-2);padding:2.5px 0;cursor:pointer}
.fopt input{margin:4px 0 0;accent-color:var(--blue);flex:none}
.fopt:hover{color:var(--ink)}
.fopt .n{margin-left:auto;color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.resbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:10px;flex-wrap:wrap}
select.field{padding:6px 8px;width:auto}

/* ---------- skeleton ---------- */
.sk{background:var(--panel-2);border-radius:var(--r-s);animation:pulse 1.25s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.skrow{padding:13px 2px;border-bottom:1px solid var(--line)}
.skrow .sk+.sk{margin-top:7px}

/* ---------- detail ---------- */
.detail-head{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}
.detail-head .rule{height:3px;width:46px;border-radius:2px;margin-bottom:12px}
.detail-head h1{font-size:28px;margin-bottom:6px;max-width:26ch}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.factlist{font-size:13.5px}
.factlist dt{font-weight:600;color:var(--ink-3);font-size:12px;margin-top:12px}
.factlist dt:first-child{margin-top:0}
.factlist dd{margin:2px 0 0;color:var(--ink)}
.people{list-style:none;padding:0;margin:0;font-size:13.5px}
.people li{padding:5px 0;border-bottom:1px solid var(--line)}
.people li:last-child{border-bottom:0}

/* ---------- schedule ---------- */
.sched-band{margin-top:26px}
.band-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;border:1px solid var(--line);border-bottom:0;border-radius:var(--r-m) var(--r-m) 0 0;background:var(--panel-2);padding:9px 14px}
.band-head h2{font-size:16px}
.weekgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:0 0 var(--r-m) var(--r-m);background:var(--panel);overflow:hidden}
.daycol{border-left:1px solid var(--line);padding:11px 11px 14px;min-width:0}
.daycol:first-child{border-left:0}
.daycol h4{font-family:inherit;font-size:12px;font-weight:600;color:var(--ink-3);margin:0 0 9px;display:flex;justify-content:space-between;gap:8px}
.daycol h4 .n{font-variant-numeric:tabular-nums}
.evt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--r-s);background:var(--paper);padding:8px 9px;margin-bottom:7px;cursor:pointer;transition:background .12s,border-color .12s}
.evt:hover{background:var(--panel-2);border-color:var(--line-2)}
.evt .nm{display:block;font-size:13px;font-weight:600;line-height:1.32;margin-bottom:3px;overflow-wrap:break-word;color:var(--ink)}
.evt .nm .dot{display:inline-block;position:relative;top:0;margin-right:6px}
.evt .tm{display:block;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.evt .rm{display:block;font-size:12px;color:var(--ink-3)}
.evt.mine{background:var(--blue-soft);border-color:var(--blue-line)}
.evt.clash{border-color:var(--warn-line)}
.evt .warnk{display:block;color:var(--warn);margin-top:4px}
.evt.flat{background:none;border-style:dashed}
.untimed{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.untimed h5{font-family:inherit;font-size:11px;font-weight:600;color:var(--ink-3);margin:0 0 7px}
.bandempty{border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r-m) var(--r-m);background:var(--panel);padding:18px 14px;font-size:13px;color:var(--ink-3)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-s);overflow:hidden}
.seg button{padding:5px 13px;border:0;background:var(--panel);font-size:13.5px;cursor:pointer;border-left:1px solid var(--line-2);white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--blue);color:#fff;font-weight:500}
:root[data-theme="dark"] .seg button.on{color:#0C1A24}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button.on{color:#0C1A24}}
.segn{margin-left:6px;font-variant-numeric:tabular-nums;opacity:.72}

/* ---------- match ---------- */
.q{border-bottom:1px solid var(--line);padding:20px 0}
.q:first-of-type{padding-top:6px}
.q legend,.q .qh{font-size:16px;font-weight:600;font-family:"Source Serif 4",Georgia,serif;margin-bottom:3px;padding:0}
.q .qs{font-size:13px;color:var(--ink-3);margin-bottom:11px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border:1px solid var(--line-2);border-radius:var(--r-s);background:var(--panel);font-size:13.5px;cursor:pointer;transition:background .12s,border-color .12s}
.opt:hover{border-color:var(--line-2);background:var(--panel-2)}
.opt input{position:absolute;opacity:0;width:0;height:0}
.opt:focus-within{outline:2px solid var(--blue);outline-offset:2px}
.opt.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue);font-weight:500}
.scorebig{font-family:"Source Serif 4",Georgia,serif;font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:5px 11px;align-items:center;font-size:12.5px;margin-top:10px}
.bar{height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:3px}
.bars .v{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:12px}
.mres{border-bottom:1px solid var(--line);padding:15px 2px}
.mres-top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.why{list-style:none;margin:0;padding:0;font-size:13px;color:var(--ink-2);max-width:60ch}
.why li{padding-left:14px;position:relative;margin-bottom:2px;line-height:1.45}
.why li::before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--green)}
.why li.con{color:var(--ink-3)}
.why li.con::before{background:var(--warn);border-radius:1px}
.progressbar{height:5px;background:var(--panel-2);border-radius:3px;overflow:hidden;max-width:320px}
.progressbar i{display:block;height:100%;background:var(--blue);transition:width .25s linear}

/* ---------- messages ---------- */
.msgcols{display:grid;grid-template-columns:288px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;background:var(--panel);height:min(640px,calc(100vh - 220px));min-height:420px}
.threads{border-right:1px solid var(--line);overflow-y:auto;background:var(--paper)}
.thread{display:block;width:100%;text-align:left;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer}
.thread:hover{background:var(--panel-2)}
.thread.on{background:var(--panel);box-shadow:inset 3px 0 0 var(--blue)}
.thread-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.thread-name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thread.unread .thread-name::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue);margin-left:7px;vertical-align:1px}
.thread-prev{font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.convo{display:flex;flex-direction:column;min-width:0}
.convo-head{padding:11px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.bubbles{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:12px;background:var(--paper)}
.bub{max-width:min(78%,52ch);font-size:14px}
.bub .who{font-size:11.5px;color:var(--ink-3);margin-bottom:3px}
.bub .txt{padding:9px 12px;border-radius:var(--r-m);background:var(--panel);border:1px solid var(--line)}
.bub.me{align-self:flex-end}
.bub.me .who{text-align:right}
.bub.me .txt{background:var(--blue-soft);border-color:var(--blue-line)}
.composer{border-top:1px solid var(--line);padding:11px 14px;display:flex;gap:9px;align-items:flex-end;background:var(--panel)}
.composer textarea{flex:1;resize:none;min-height:38px;max-height:120px;padding:9px 11px;border:1px solid var(--line-2);border-radius:var(--r-s);background:var(--paper);color:var(--ink);font:inherit;font-size:14px}
.notice{background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--warn);border-radius:var(--r-s);padding:8px 11px;font-size:12.5px}

/* ---------- dashboard ---------- */
.upnext{list-style:none;margin:0;padding:0}
.upnext li{display:flex;gap:11px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.upnext li:last-child{border-bottom:0}
.dot{width:8px;height:8px;border-radius:2px;flex:none;position:relative;top:5px}
.when{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:auto}
.empty{border:1px dashed var(--line-2);border-radius:var(--r-m);padding:26px 22px;text-align:left;color:var(--ink-2);font-size:14px;background:var(--panel)}
.empty h3{margin-bottom:5px;color:var(--ink)}

/* ---------- legal ---------- */
.legal h2{font-size:18px;margin:26px 0 7px}
.legal h1+p{color:var(--ink-2)}
.legal ul{padding-left:20px}
.legal li{margin-bottom:5px}

/* ---------- footer ---------- */
.foot{border-top:1px solid var(--line);background:var(--panel);margin-top:20px}
.foot-in{max-width:1180px;margin:0 auto;padding:22px 20px 34px;display:flex;justify-content:space-between;gap:22px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.foot a{color:var(--ink-2)}
.foot nav{display:flex;gap:18px}
.credit{margin-top:6px;color:var(--ink-3);font-size:12.5px}

/* ---------- dialog ---------- */
dialog{border:1px solid var(--line-2);border-radius:var(--r-l);padding:0;background:var(--panel);color:var(--ink);max-width:460px;width:calc(100% - 32px);box-shadow:0 14px 40px rgba(10,20,28,.24)}
dialog::backdrop{background:rgba(12,20,26,.4)}
.dlg-head{padding:16px 18px 0}
.dlg-body{padding:10px 18px 0;font-size:14px}
.dlg-foot{padding:16px 18px;display:flex;justify-content:flex-end;gap:8px}

@media (max-width:900px){
  .cols,.dircols{grid-template-columns:minmax(0,1fr);gap:26px}
  .filters{position:static}
  .msgcols{grid-template-columns:minmax(0,1fr);height:auto}
  .threads{max-height:none;border-right:0;border-bottom:1px solid var(--line)}
  .msgcols.viewing .threads{display:none}
  .msgcols:not(.viewing) .convo{display:none}
  .bubbles{min-height:300px}
  .daylists{grid-template-columns:repeat(2,1fr)}
  .daylists>div:nth-child(odd){border-left:0}
  .daylists>div{border-top:1px solid var(--line)}
}
@media (max-width:720px){
  .mainnav{display:none}
  .topbar-in{justify-content:space-between;gap:12px}
  .botnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .botnav a{flex:1;text-align:center;padding:9px 2px 10px;font-size:11px;font-weight:500;color:var(--ink-3);border-top:2px solid transparent;margin-top:-1px}
  .botnav a.on{color:var(--blue);border-top-color:var(--blue);font-weight:600}
  .botnav a:hover{text-decoration:none}
  body{padding-bottom:58px}
  .wrap{padding:20px 16px 40px}
  h1,.intro h1{font-size:25px}
  .clubrow-sum{-webkit-line-clamp:3}
  .daylists{grid-template-columns:1fr}
  .daylists>div{border-left:0}
}
@media (max-width:1000px){
  .weekgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .daycol{border-top:1px solid var(--line)}
  .daycol:nth-child(odd){border-left:0}
  .daycol:first-child,.daycol:nth-child(2){border-top:0}
}
@media (max-width:640px){
  .weekgrid{grid-template-columns:minmax(0,1fr)}
  .daycol{border-left:0;border-top:1px solid var(--line)}
  .daycol:first-child{border-top:0}
  .mres-top{flex-direction:column;gap:10px}
  .mres-top>div:last-child{width:100%!important;text-align:left!important}
  .bars{max-width:340px}
}
</style>
</head>

const $ = (s,r)=> (r||document).querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fmtTime = m => { if(m==null) return ""; let h=Math.floor(m/60), mm=m%60; const ap=h<12?"AM":"PM"; h=h%12||12;
  return h + (mm? ":"+String(mm).padStart(2,"0") : "") + " " + ap; };
const timeRange = mt => mt.start==null ? "" : (mt.openEnd ? "Starts "+fmtTime(mt.start) : fmtTime(mt.start)+"\u2013"+fmtTime(mt.end));

function meetingLine(c){
  const m=c.meeting, out=[];
  if(m.days.length) out.push(m.days.length>2 ? m.days.length+" days a week" : m.days.map(d=>DAY_FULL[d]+"s").join(" and "));
  if(m.start!=null) out.push(timeRange(m));
  if(m.freq && !(m.freq==="Weekly" && m.days.length)) out.push(m.freq);
  if(m.room) out.push("Room "+m.room);
  if(!out.length) return "Meeting time not posted";
  return out.join(" \u00b7 ");
}
function sponsorNames(c){ return c.sponsors.map(s=>s.name).join(", "); }

}

/* next occurrence of a weekday */
function nextDate(dayAbbr, startMin){
  const idx = {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[dayAbbr];
  const now = new Date();
  const d = new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let delta = (idx - d.getDay() + 7) % 7;
  if(delta===0 && startMin!=null && (now.getHours()*60+now.getMinutes()) > startMin) delta = 7;
  d.setDate(d.getDate()+delta);
  if(startMin!=null) d.setMinutes(startMin);
  return d;
}
function relDay(d){
  const now=new Date(), a=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const diff = Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - a)/864e5);
  if(diff===0) return "Today"; if(diff===1) return "Tomorrow";
  return d.toLocaleDateString(undefined,{weekday:"short", month:"short", day:"numeric"});
}
function upcoming(ids){
  const list = (ids? ids.map(i=>BY_ID[i]).filter(Boolean) : CLUBS).filter(c=>c.meeting.days.length && c.status==="active");
  const out=[];
  list.forEach(c=> c.meeting.days.forEach(d=>{
    if(d==="Sat") return;
    out.push({club:c, day:d, date:nextDate(d,c.meeting.start), start:c.meeting.start});
  }));
  out.sort((a,b)=>a.date-b.date);
  return out;
}

const F = {q:"", cats:new Set(), days:new Set(), tags:new Set(), when:"", commit:"", openOnly:false, sort:"name"};

function viewClubs(v){
  const qs = new URLSearchParams((location.hash.split("?")[1])||"");
  if(qs.get("q")!==null){ F.q = qs.get("q")||""; }
  if(qs.get("cat")){ F.cats = new Set([qs.get("cat")]); }
  if(qs.get("tag")){ F.tags = new Set([qs.get("tag")]); }

  v.innerHTML = '<h1>Club directory</h1>'
    + '<p class="muted" style="max-width:62ch">Every club listed on the 2026&ndash;27 activities sheet. Filter by what it does, when it meets and whether it is still taking members.</p>'
    + '<div class="dircols" style="margin-top:22px"><div class="filters" id="filters"></div>'
    + '<div><div class="resbar"><div><input class="field" id="dq" type="search" style="width:min(340px,100%)" placeholder="Search clubs, sponsors or topics" aria-label="Search clubs"></div>'
    + '<div class="small muted" style="display:flex;gap:10px;align-items:center"><span id="count"></span>'
    + '<label for="sort" class="dim">Sort</label><select class="field" id="sort"><option value="name">A to Z</option><option value="soon">Meets soonest</option><option value="cat">Category</option></select></div></div>'
    + '<div id="results">'+skeletonRows(6)+'</div></div></div>';

  $("#dq").value = F.q;
  $("#sort").value = F.sort;
  $("#dq").oninput = e=>{ F.q=e.target.value; paint(); };
  $("#sort").onchange = e=>{ F.sort=e.target.value; paint(); };
  drawFilters();
  afterLoad(380, paint);

  function counts(list, key){
    const m={}; list.forEach(c=>{ const vals = key==="cat"?[c.category]:c.tags; vals.forEach(x=>m[x]=(m[x]||0)+1); });
    return m;
  }
  function drawFilters(){
    const ct = counts(CLUBS,"cat"), tt = counts(CLUBS,"tag");
    const box = (title, opts) => '<div class="fgroup"><h4>'+title+'</h4>'+opts+'</div>';
    const cb = (set,val,label,n) => '<label class="fopt"><input type="checkbox" data-set="'+set+'" value="'+esc(val)+'"'
      + ((set==="cats"?F.cats:set==="days"?F.days:F.tags).has(val)?" checked":"")+'>'
      + '<span>'+esc(label)+'</span>'+(n!=null?'<span class="n">'+n+'</span>':"")+'</label>';
    const radio = (name,val,label,cur) => '<label class="fopt"><input type="radio" name="'+name+'" value="'+val+'"'+(cur===val?" checked":"")+'><span>'+esc(label)+'</span></label>';

    $("#filters").innerHTML =
      box("What it does", Object.keys(TAG_LABEL).filter(t=>tt[t]).sort((a,b)=>tt[b]-tt[a]).map(t=>cb("tags",t,TAG_LABEL[t],tt[t])).join(""))
    + box("Category", CATS.map(c=>cb("cats",c,c,ct[c])).join(""))
    + box("Meeting day", DAYS.map(d=>cb("days",d,DAY_FULL[d])).join(""))
    + box("Time of day", radio("when","","Any",F.when)+radio("when","before","Before school",F.when)+radio("when","after","After school",F.when))
    + box("Commitment", radio("commit","","Any",F.commit)+radio("commit","high","Several days a week",F.commit)+radio("commit","medium","About once a week",F.commit)+radio("commit","low","Once or twice a month",F.commit))
    + '<div class="fgroup"><label class="fopt"><input type="checkbox" id="openOnly"'+(F.openOnly?" checked":"")+'><span>Hide clubs without a sponsor or marked inactive</span></label>'
    + '<button class="linkbtn small" id="clearF" style="margin-top:10px">Clear all filters</button></div>';

    $("#filters").querySelectorAll('input[data-set]').forEach(el=>el.onchange=()=>{
      const set = el.dataset.set==="cats"?F.cats:el.dataset.set==="days"?F.days:F.tags;
      el.checked ? set.add(el.value) : set.delete(el.value); paint();
    });
    $("#filters").querySelectorAll('input[name="when"]').forEach(el=>el.onchange=()=>{F.when=el.value;paint();});
    $("#filters").querySelectorAll('input[name="commit"]').forEach(el=>el.onchange=()=>{F.commit=el.value;paint();});
    $("#openOnly").onchange = e=>{F.openOnly=e.target.checked;paint();};
    $("#clearF").onclick = ()=>{ F.q="";F.cats.clear();F.days.clear();F.tags.clear();F.when="";F.commit="";F.openOnly=false;
      $("#dq").value=""; drawFilters(); paint(); };
  }

  function paint(){
    let list = CLUBS.slice();
    const q = F.q.trim().toLowerCase();
    if(q) list = list.filter(c=> (c.name+" "+c.summary+" "+c.category+" "+sponsorNames(c)+" "+c.tags.map(t=>TAG_LABEL[t]).join(" ")).toLowerCase().includes(q));
    if(F.cats.size) list = list.filter(c=>F.cats.has(c.category));
    if(F.tags.size) list = list.filter(c=>c.tags.some(t=>F.tags.has(t)));
    if(F.days.size) list = list.filter(c=>c.meeting.days.some(d=>F.days.has(d)));
    if(F.when) list = list.filter(c=>c.when===F.when);
    if(F.commit) list = list.filter(c=>c.commitment===F.commit);
    if(F.openOnly) list = list.filter(c=>c.status==="active"||c.status==="pending");
    if(F.sort==="cat") list.sort((a,b)=> a.category.localeCompare(b.category) || a.name.localeCompare(b.name));
    else if(F.sort==="soon") list.sort((a,b)=>{
      const av=a.meeting.days.length?nextDate(a.meeting.days[0],a.meeting.start):1e15;
      const bv=b.meeting.days.length?nextDate(b.meeting.days[0],b.meeting.start):1e15;
      return av-bv || a.name.localeCompare(b.name);
    });
    else list.sort((a,b)=>a.name.localeCompare(b.name));

    $("#count").textContent = list.length + (list.length===1?" club":" clubs");
    $("#results").innerHTML = list.length
      ? '<div class="clublist">'+list.map(c=>clubRow(c)).join("")+'</div>'
      : '<div class="empty"><h3>No clubs match those filters</h3><p style="margin:0">Try removing a filter, or search for a topic like "service", "debate" or "robotics".</p></div>';
  }
}

/* ---------------- Seahawk Match ---------------- */
const GOALS = [
  ["learn","Learning something new"],["skills","Developing new skills"],["academic","Exploring an academic interest"],
  ["career","Exploring a possible career"],["resume","Building my resume"],["college","College application involvement"],
  ["leadership","Leadership experience"],["service","Community service"],["competition","Competition experience"],
  ["meet","Meeting new people"],["friends","Making friends"],["build","Building projects"],
  ["create","Creating something"],["speaking","Improving public speaking"],["team","Working with a team"],
  ["fun","Having fun and relaxing"],["stretch","Trying something outside my comfort zone"]
];
const LOADS = [["monthly","About once a month"],["twicemonth","Twice a month"],["weekly","Once a week"],["multi","Several days a week"]];
const LOAD_ORDER = {monthly:0,twicemonth:1,weekly:2,multi:3};

function goalSupport(c,g){
  const has = (arr,x)=>arr.indexOf(x)>=0;
  switch(g){
    case "learn": return c.learn.length?1:(c.tags.length?0.4:0);
    case "skills": return c.learn.length?1:0;
    case "academic": return (has(c.tags,"academic")||has(c.tags,"stem"))?1:0;
    case "career": return (has(c.tags,"career")||has(c.tags,"business"))?1:0;
    case "resume": case "college":
      return (has(c.tags,"service")||has(c.tags,"leadership")||has(c.tags,"competition")
        ||has(c.acts,"leadership")||has(c.acts,"volunteering")||has(c.acts,"competition"))?1:0;
    case "leadership": return (has(c.tags,"leadership")||has(c.acts,"leadership"))?1:0;
    case "service": return (has(c.tags,"service")||has(c.acts,"volunteering"))?1:0;
    case "competition": return (has(c.tags,"competition")||has(c.acts,"competition"))?1:0;
    case "meet": case "friends": return has(c.acts,"social")?1:(has(c.acts,"teamwork")?0.5:0);
    case "build": return has(c.acts,"building")?1:0;
    case "create": return has(c.acts,"creative")?1:0;
    case "speaking": return has(c.acts,"speaking")?1:(has(c.acts,"performance")?0.5:0);
    case "team": return has(c.acts,"teamwork")?1:0;
    case "fun": return (has(c.tags,"recreation")||has(c.acts,"social"))?1:0;
    case "stretch": return (has(c.acts,"performance")||has(c.acts,"speaking")||has(c.acts,"competition"))?1:0;
  }
  return 0;
}

function scoreClub(c,A){
  const overlap = (sel,have)=> sel.filter(x=>have.indexOf(x)>=0);
  const f={}, hit={}, mult=[];

  const iHit = overlap(A.interests,c.tags); hit.interests=iHit;
  f.Interests = A.interests.length ? iHit.length/A.interests.length : 0.5;

  const lHit = overlap(A.learn,c.learn); hit.learn=lHit;
  f.Learning = A.learn.length ? lHit.length/A.learn.length : 0.5;

  const aHit = overlap(A.acts,c.acts); hit.acts=aHit;
  f.Activities = A.acts.length ? aHit.length/A.acts.length : 0.5;

  const gScores = A.goals.map(g=>[g,goalSupport(c,g)]);
  hit.goals = gScores.filter(x=>x[1]>=1).map(x=>x[0]);
  hit.goalsMissed = gScores.filter(x=>x[1]<=0).map(x=>x[0]);
  f.Goals = A.goals.length ? gScores.reduce((s,x)=>s+x[1],0)/A.goals.length : 0.5;

  let dayOk=true, timeOk=true;
  if(!c.meeting.days.length){ f.Availability = 0.45; hit.avail="unknown"; }
  else{
    dayOk = !A.days.length || c.meeting.days.some(d=>A.days.indexOf(d)>=0);
    timeOk = !A.when || c.when==="unscheduled" || c.when===A.when;
    f.Availability = dayOk ? (timeOk?1:0.25) : 0.05;
    hit.avail = dayOk ? (timeOk?"fits":"wrongtime") : "wrongday";
    if(!dayOk) mult.push(0.75);
    if(!timeOk) mult.push(0.9);
  }

  if(!A.load || c.commitment==="unknown"){ f.Commitment = c.commitment==="unknown"?0.45:0.5; hit.commit="unknown"; }
  else{
    const d = Math.abs(LOAD_ORDER[c.commitment]-LOAD_ORDER[A.load]);
    f.Commitment = Math.max(0.1, 1 - d*0.3);
    hit.commit = d===0?"exact":d===1?"close":"far";
    if(d>=2) mult.push(0.9);
  }

  if(c.status==="needs-sponsor") mult.push(0.75);
  if(c.status==="pending") mult.push(0.92);

  const W = {Interests:30,Learning:15,Activities:15,Goals:15,Availability:15,Commitment:10};
  let total = Object.keys(W).reduce((s,k)=>s+W[k]*f[k],0);
  mult.forEach(m=>total*=m);
  const detail = ((c.meeting.days.length?1:0)+(c.meeting.start!=null?1:0)+(c.meeting.room?1:0)+(c.summary?1:0))/4;
  total *= 0.96 + 0.04*detail;
  const parts={}; Object.keys(W).forEach(k=>parts[k]=Math.round(f[k]*100));
  return {score:Math.round(Math.max(1,Math.min(100,total))), parts, hit};
}

function joinList(a){ return a.length<2 ? (a[0]||"") : a.slice(0,-1).join(", ")+" and "+a[a.length-1]; }
function matchWhy(c,r,A){
  const good=[], bad=[];
  const L = k=>TAG_LABEL[k], AL = k=>ACT_LABEL[k], LL = k=>LEARN_LABEL[k];
  const gname = k=>(GOALS.find(g=>g[0]===k)||["",""])[1].toLowerCase();

  if(r.hit.interests.length) good.push("Its description covers "+joinList(r.hit.interests.map(L).map(s=>s.toLowerCase()))+".");
  else if(A.interests.length) bad.push("Nothing in its description matches the interests you picked.");

  if(r.hit.learn.length) good.push("Works on "+joinList(r.hit.learn.map(LL).map(s=>s.toLowerCase()))+".");
  else if(A.learn.length) bad.push("Does not list anything you wanted to learn.");

  if(r.hit.acts.length) good.push("Involves "+joinList(r.hit.acts.map(AL).map(s=>s.toLowerCase()))+".");
  else if(A.acts.length) bad.push("None of the activity styles you chose show up in its description.");

  if(r.hit.goals.length) good.push("Offers "+joinList(r.hit.goals.slice(0,3).map(gname))+".");
  if(r.hit.goalsMissed.length && r.hit.goalsMissed.length===A.goals.length) bad.push("Does not appear to offer what you said you wanted out of a club.");
  else if(r.hit.goalsMissed.length) bad.push("No sign of "+joinList(r.hit.goalsMissed.slice(0,2).map(gname))+".");

  const days = c.meeting.days.map(d=>DAY_FULL[d]);
  if(r.hit.avail==="fits" && days.length) good.push("Meets "+joinList(days)+(A.days.length?", which you are free":"")+".");
  if(r.hit.avail==="wrongday") bad.push("Meets "+joinList(days)+", and you did not mark those days free.");
  if(r.hit.avail==="wrongtime") bad.push("Meets "+(c.when==="before"?"before school":"after school")+", not when you said you can go.");
  if(r.hit.avail==="unknown") bad.push("No meeting day posted yet.");

  if(r.hit.commit==="exact" && A.load) good.push("Meets "+(LOADS.find(l=>l[0]===A.load)[1].toLowerCase())+", the amount you picked.");
  if(r.hit.commit==="far") bad.push("Meets "+(LOADS.find(l=>l[0]===c.commitment)||["",""])[1].toLowerCase()+", more or less often than you wanted.");
  if(c.status==="needs-sponsor") bad.push("No sponsor listed, so it may not meet this year.");
  return {good:good.slice(0,4), bad:bad.slice(0,2)};
}

function viewMatch(v){

  const tagOpts = Object.keys(TAG_LABEL);
  v.innerHTML = '<div class="narrow"><h1>Seahawk Match</h1>'

function runMatch(v,A){
  v.innerHTML = '<div class="narrow"><h1>Scoring clubs</h1><p class="muted">Comparing your answers against '+CLUBS.length+' clubs.</p>'
    + '<div class="progressbar" style="margin-top:16px"><i id="pb" style="width:6%"></i></div>'
    + '<p class="small dim" id="pbl" style="margin-top:10px">Reading club descriptions</p></div>';
  const steps=[[30,"Matching interests and topics"],[55,"Checking activity styles and goals"],[80,"Checking days, times and commitment"],[100,"Ranking results"]];
  let i=0;
  const tick=()=>{
    if(i>=steps.length){
      const res = CLUBS.filter(c=>c.status!=="inactive").map(c=>{
        const r = scoreClub(c,A); r.id=c.id; r.why = matchWhy(c,r,A); return r;
      }).sort((a,b)=>b.score-a.score);
      const strong = res.filter(r=>r.score>=45).slice(0,10);
      const shown = strong.length>=5 ? strong : res.slice(0,5);
      S.match = {v:2, answers:A, results:shown, at:Date.now()}; save();
      matchResults($("#view"));
      return;
    }
    const s=steps[i++];
    const pb=$("#pb"); if(pb){ pb.style.width=s[0]+"%"; $("#pbl").textContent=s[1]; }
    pending=setTimeout(tick,300);
  };
  pending=setTimeout(tick,280);
}

function matchResults(v){
  const A = S.match.answers, R = S.match.results;
  const bits=[];
  if(A.interests.length) bits.push(A.interests.map(t=>TAG_LABEL[t]).join(", "));
  if(A.learn.length) bits.push("wants to learn "+A.learn.map(t=>LEARN_LABEL[t].toLowerCase()).join(", "));
  if(A.days.length) bits.push("free "+A.days.map(d=>DAY_FULL[d]).join(", "));
  if(A.load) bits.push((LOADS.find(l=>l[0]===A.load)||["",""])[1].toLowerCase());
  v.innerHTML = '<div class="row-between"><div><h1>Your matches</h1>'
    + '<p class="muted" style="max-width:64ch">'+(bits.length? esc(bits.join("; "))+"." : "No preferences selected.")+'</p></div>'
    + '<button class="btn" id="redo">Change my answers</button></div>'
    + '<div style="margin-top:14px">'+R.map(r=>{
        const c=BY_ID[r.id]; if(!c) return "";
        return '<div class="mres"><div class="mres-top"><div style="min-width:0">'
          + '<a href="#/club/'+c.id+'" style="font-weight:600;font-size:15.5px;color:var(--ink)">'+esc(c.name)+'</a>'
          + '<div class="meta" style="margin:3px 0 8px">'+esc(meetingLine(c))+'</div>'
          + '<ul class="why">'+r.why.good.map(t=>'<li>'+esc(t)+'</li>').join("")
            + r.why.bad.map(t=>'<li class="con">'+esc(t)+'</li>').join("")+'</ul>'
          + '</div>'
          + '<div style="text-align:right;flex:none;width:200px">'
            + '<div class="scorebig">'+r.score+'<span style="font-size:15px;font-weight:600">%</span></div>'
            + '<div class="xs dim">match</div>'
            + '<div class="bars">'+Object.keys(r.parts).map(k=>
                '<span class="dim">'+k+'</span><span class="bar"><i style="width:'+r.parts[k]+'%"></i></span><span class="v">'+r.parts[k]+'</span>').join("")
            + '</div></div></div></div>';
      }).join("")+'</div>'
    + '<p class="small dim" style="margin-top:18px;max-width:64ch">Weighting: interests 30, learning 15, activity style 15, goals 15, availability 15, commitment 10. A club scores nothing in a category its own description does not support, and meeting on a day you cannot attend cuts the whole score.</p>';
  $("#redo").onclick = ()=>{ S.match=null; save(); viewMatch($("#view")); };
}

/* ---------------- schedule ---------------- */
let schedScope = "mine", schedChosen = false;
function viewSchedule(v){
  const joined = S.joined.map(i=>BY_ID[i]).filter(Boolean);
  const interested = S.interested.map(i=>BY_ID[i]).filter(Boolean);
  if(!schedChosen) schedScope = joined.length ? "mine" : (interested.length ? "interested" : "all");

  const src = schedScope==="mine" ? joined
            : schedScope==="interested" ? interested
            : CLUBS.filter(c=>c.status==="active");

  const before = src.filter(c=>c.when==="before" && c.meeting.days.length);
  const after  = src.filter(c=>c.when==="after"  && c.meeting.days.length);
  const untimed= src.filter(c=>c.meeting.days.length && c.meeting.start==null);
  const noDay  = src.filter(c=>!c.meeting.days.length);

  const endOf = c => c.meeting.openEnd ? c.meeting.start : c.meeting.end;
  const span = (list, floor, ceil) => {
    const s = list.length ? Math.min(floor, Math.min.apply(null,list.map(c=>c.meeting.start))) : floor;
    const e = list.length ? Math.max(ceil,  Math.max.apply(null,list.map(endOf)))              : ceil;
    return fmtTime(s)+" \u2013 "+fmtTime(e);
  };
  const beforeRange = span(before, 6*60+30, 8*60+10);
  const afterRange  = span(after, 14*60+55, 18*60);

  v.innerHTML = '<div class="row-between"><div><h1>Weekly schedule</h1>'
    + '<p class="muted" style="max-width:64ch">Club meetings by weekday, split into the before-school and after-school windows. Select a meeting for the full details.</p></div>'
    + '<div class="seg">'
      + '<button data-s="mine" class="'+(schedScope==="mine"?"on":"")+'">My clubs<span class="segn">'+joined.length+'</span></button>'
      + '<button data-s="interested" class="'+(schedScope==="interested"?"on":"")+'">Interested<span class="segn">'+interested.length+'</span></button>'
      + '<button data-s="all" class="'+(schedScope==="all"?"on":"")+'">All clubs</button>'
    + '</div></div>'
    + '<div id="conf"></div>'
    + band("Before school", beforeRange, before, [])
    + band("After school", afterRange, after, untimed)
    + (src.length ? '<p class="small dim" style="margin-top:18px">'+noDay.length+' '
        + (schedScope==="all"?"clubs have":"of these clubs have")+' not posted a meeting day yet.</p>'
      : '<div class="empty" style="margin-top:18px;max-width:640px"><h3>'
        + (schedScope==="mine"?"You have not joined a club yet":"Nothing saved as interested")+'</h3>'
        + '<p style="margin:0">Open a club and '+(schedScope==="mine"?"join it":"save it as interested")
        + ', or switch to All clubs to see the full week.</p></div>');

  v.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{ schedScope=b.dataset.s; schedChosen=true; viewSchedule($("#view")); });

  // overlap warnings across clubs the student has joined
  const clashes=[];
  const jt = joined.filter(c=>c.meeting.days.length && c.meeting.start!=null);
  for(let i=0;i<jt.length;i++) for(let j=i+1;j<jt.length;j++){
    const a=jt[i], b=jt[j];
    const d = a.meeting.days.filter(x=>b.meeting.days.indexOf(x)>=0);
    if(d.length && a.meeting.start<b.meeting.end && b.meeting.start<a.meeting.end) clashes.push({a,b,days:d});
  }
  $("#conf").innerHTML = clashes.length
    ? '<div class="notice" style="margin-top:16px">'+clashes.map(x=>esc(x.a.name)+" and "+esc(x.b.name)
        +" overlap on "+x.days.map(d=>DAY_FULL[d]).join(" and ")+".").join("<br>")+'</div>' : "";

  v.querySelectorAll(".evt").forEach(el=>el.onclick=()=>showMeeting(el.dataset.id));

  function band(title, rangeText, timed, untimedList){
    const has = timed.length || untimedList.length;
    return '<section class="sched-band">'
      + '<div class="band-head"><h2>'+title+'</h2><span class="small dim">'+rangeText+'</span></div>'
      + (has ? '<div class="weekgrid">'+DAYS.map(d=>dayColumn(d,timed,untimedList)).join("")+'</div>'
             : '<div class="bandempty">No '+title.toLowerCase()+' meetings in this view.</div>')
      + '</section>';
  }
  function dayColumn(d, timed, untimedList){
    const evs = timed.filter(c=>c.meeting.days.indexOf(d)>=0).sort((a,b)=>a.meeting.start-b.meeting.start);
    const un  = untimedList.filter(c=>c.meeting.days.indexOf(d)>=0);
    let html = '<h4>'+DAY_FULL[d]+'<span class="n">'+(evs.length+un.length||"")+'</span></h4>';
    if(!evs.length && !un.length) html += '<p class="xs dim" style="margin:0">Nothing listed</p>';
    evs.forEach(c=>{
      const clash = schedScope!=="all" && evs.some(o=>o!==c && o.meeting.start<c.meeting.end && c.meeting.start<o.meeting.end);
      html += '<button class="evt'+(clash?" clash":"")+(isJoined(c.id)?" mine":"")+'" data-id="'+c.id+'">'
        + '<span class="nm"><span class="dot" style="background:'+c.color+'"></span>'+esc(c.name)+'</span>'
        + '<span class="tm">'+esc(timeRange(c.meeting))+'</span>'
        + '<span class="rm">'+(c.meeting.room? "Room "+esc(c.meeting.room) : '<span class="dim">Room not posted</span>')+'</span>'
        + (clash? '<span class="xs warnk">Overlaps another meeting</span>' : "")
        + '</button>';
    });
    if(un.length){
      html += '<div class="untimed"><h5>Time not posted</h5>'+un.map(c=>
        '<button class="evt flat" data-id="'+c.id+'"><span class="nm"><span class="dot" style="background:'+c.color+'"></span>'+esc(c.name)+'</span>'
        + (c.meeting.room? '<span class="rm">Room '+esc(c.meeting.room)+'</span>' : "")+'</button>').join("")+'</div>';
    }
    return '<div class="daycol">'+html+'</div>';
  }
}

function showMeeting(id){
  const c = BY_ID[id]; if(!c) return;
  const m = c.meeting;
  $("#dlgTitle").textContent = c.name;
  $("#dlgBody").innerHTML = '<dl class="factlist">'
    + '<dt>Meets</dt><dd>'+(m.days.length? esc(m.days.map(d=>DAY_FULL[d]).join(", ")) : '<span class="dim">Not posted</span>')+'</dd>'
    + '<dt>Time</dt><dd>'+(m.start!=null? esc(timeRange(m)) : '<span class="dim">Not posted</span>')+'</dd>'
    + '<dt>Location</dt><dd>'+(m.room? "Room "+esc(m.room) : '<span class="dim">Not posted</span>')+'</dd>'
    + (m.freq? '<dt>How often</dt><dd>'+esc(m.freq)+'</dd>' : "")
    + (c.sponsors.length? '<dt>Sponsor</dt><dd>'+esc(c.sponsors.map(s=>s.name).join(", "))+'</dd>' : "")
    + '</dl>'
    + (m.raw? '<p class="small muted" style="margin-top:12px">'+esc(m.raw)+'</p>' : "")
    + '<p style="margin-top:12px"><a href="#/club/'+c.id+'" id="dlgGo">Open club page</a></p>';
  const d=$("#dlg"); d.showModal();
  $("#dlgClose").onclick=()=>d.close();
  const go=$("#dlgGo"); if(go) go.onclick=()=>d.close();
}

/* ---------------- my clubs ---------------- */
function viewMy(v){
  const joined = S.joined.map(i=>BY_ID[i]).filter(Boolean);
  const interested = S.interested.map(i=>BY_ID[i]).filter(Boolean);
  if(!joined.length && !interested.length){
    v.innerHTML = '<h1>My Clubs</h1><div class="empty" style="margin-top:18px;max-width:640px">'
      + '<h3>Nothing saved yet</h3>'
      + '<p>Join a club to put its meetings on your schedule, or save one as interested while you decide.</p>'
      + '<p style="margin:0"><a class="btn btn-pri btn-sm" href="#/clubs">Browse the directory</a> <a class="btn btn-sm" href="#/match">Try Seahawk Match</a></p></div>';
    return;
  }
  const up = upcoming(S.joined.concat(S.interested)).slice(0,6);
  const needsAction = joined.concat(interested).filter(c=>c.selective || c.status==="needs-sponsor" || !c.meeting.days.length);

  v.innerHTML = '<h1>My Clubs</h1>'
  + '<div class="cols" style="margin-top:20px"><div>'
    + '<div class="sec-head"><h2>Next meetings</h2><a class="small" href="#/schedule">Week view</a></div>'
    + (up.length? '<ul class="upnext">'+up.map(e=>
        '<li><span class="dot" style="background:'+e.club.color+'"></span>'
        + '<span><a href="#/club/'+e.club.id+'">'+esc(e.club.name)+'</a>'
        + '<span class="meta" style="display:block">'+esc([e.club.meeting.start!=null?timeRange(e.club.meeting):"Time not posted", e.club.meeting.room?"Room "+e.club.meeting.room:""].filter(Boolean).join(" \u00b7 "))+'</span></span>'
        + '<span class="when">'+relDay(e.date)+'</span></li>').join("")+'</ul>'
      : '<p class="small dim">None of your clubs has posted a meeting day. Message a sponsor to ask.</p>')
    + '<div class="sec-head" style="margin-top:30px"><h2>Joined</h2><span class="small dim">'+joined.length+'</span></div>'
    + (joined.length? '<div class="clublist">'+joined.map(c=>clubRow(c)).join("")+'</div>' : '<p class="small dim">You have not joined a club yet.</p>')
    + '<div class="sec-head" style="margin-top:30px"><h2>Interested</h2><span class="small dim">'+interested.length+'</span></div>'
    + (interested.length? '<div class="clublist">'+interested.map(c=>clubRow(c)).join("")+'</div>' : '<p class="small dim">Nothing saved as interested.</p>')
  + '</div><aside class="aside">'
    + '<div class="panel pad"><h3>Needs a next step</h3>'
      + (needsAction.length? '<ul class="people">'+needsAction.slice(0,6).map(c=>'<li><a href="#/club/'+c.id+'">'+esc(c.name)+'</a><br><span class="xs dim">'
          + (c.status==="needs-sponsor"?"No sponsor listed yet":c.selective?"Application, audition or course required":"Meeting day not posted")+'</span></li>').join("")+'</ul>'
        : '<p class="small muted" style="margin:0">Nothing pending. Every club you saved has its details posted.</p>')
    + '</div>'
    + '<div class="panel pad"><h3>Announcements</h3><p class="small muted" style="margin:0">No announcements from your clubs. Sponsors can post here once a club is set up in the hub.</p></div>'
  + '</aside></div>';
}

/* ---------------- messages ---------------- */
let activeThread = null;
function openThreadFor(clubId){
  seedThreads();
  let t = S.threads.find(x=>x.clubId===clubId);
  if(!t){
    const c = BY_ID[clubId];
    t = {id:"t"+Date.now(), clubId, role: c.sponsors.length? "Faculty sponsor":"Student leader", unread:false, msgs:[]};
    S.threads.unshift(t); save();
  }
  activeThread = t.id;
  const already = (location.hash||"") === "#/messages";
  location.hash = "#/messages";
  if(already) router();
}

function viewMessages(v){
  seedThreads();
  const threads = S.threads;
  if(!threads.length){
    v.innerHTML = '<h1>Messages</h1><div class="empty" style="margin-top:18px;max-width:640px"><h3>No conversations yet</h3>'
      + '<p style="margin:0">Open a club and choose "Message the club" to ask about a first meeting, what to bring, or whether there is still room.</p></div>';
    return;
  }
  if(!activeThread || !threads.some(t=>t.id===activeThread)) activeThread = threads[0].id;

  v.innerHTML = '<div class="row-between" style="margin-bottom:14px"><h1>Messages</h1></div>'
    + '<p class="notice" style="max-width:720px;margin-bottom:14px">Prototype only. Messages are stored in this browser and are not delivered to staff or students.</p>'
    + '<div class="msgcols'+(window.innerWidth<=900?"":" viewing")+'" id="mc">'
    + '<div class="threads" id="tl"></div>'
    + '<div class="convo" id="cv"></div></div>';
  paintThreads(); paintConvo();

  function paintThreads(){
    $("#tl").innerHTML = threads.map(t=>{
      const c=BY_ID[t.clubId]; if(!c) return "";
      const last = t.msgs[t.msgs.length-1];
      return '<button class="thread'+(t.id===activeThread?" on":"")+(t.unread?" unread":"")+'" data-t="'+t.id+'">'
        + '<div class="thread-top"><span class="thread-name">'+esc(c.name)+'</span>'
        + '<span class="xs dim">'+(last?shortTime(last.t):"")+'</span></div>'
        + '<div class="xs dim">'+esc(t.role)+'</div>'
        + '<div class="thread-prev">'+(last? esc((last.from==="me"?"You: ":"")+last.text) : '<span class="dim">No messages yet</span>')+'</div></button>';
    }).join("");
    $("#tl").querySelectorAll(".thread").forEach(b=>b.onclick=()=>{
      activeThread=b.dataset.t;
      const t=threads.find(x=>x.id===activeThread); if(t&&t.unread){ t.unread=false; save(); renderNav(); }
      $("#mc").classList.add("viewing"); paintThreads(); paintConvo();
    });
  }
  function paintConvo(){
    const t = threads.find(x=>x.id===activeThread), c = BY_ID[t.clubId];
    $("#cv").innerHTML = '<div class="convo-head"><div style="min-width:0">'
      + '<div style="font-weight:600">'+esc(c.name)+'</div><div class="xs dim">'+esc(t.role)+'</div></div>'
      + '<div style="display:flex;gap:8px"><a class="btn btn-sm" href="#/club/'+c.id+'">Club page</a>'
      + '<button class="btn btn-sm" id="back" style="display:none">Back</button></div></div>'
      + '<div class="bubbles" id="bb">'+(t.msgs.length? t.msgs.map(m=>
          '<div class="bub '+(m.from==="me"?"me":"")+'"><div class="who">'+(m.from==="me"?"You":esc(t.role))+' \u00b7 '+shortTime(m.t)+'</div>'
          + '<div class="txt">'+esc(m.text)+'</div></div>').join("")
        : '<p class="small dim">No messages yet. Ask when the next meeting is or what to bring.</p>')+'</div>'
      + '<div class="composer"><textarea id="ta" rows="1" placeholder="Write a message" aria-label="Message"></textarea>'
      + '<button class="btn btn-pri" id="send">Send</button></div>';
    const bb=$("#bb"); bb.scrollTop = bb.scrollHeight;
    if(window.innerWidth<=900){ const b=$("#back"); b.style.display=""; b.onclick=()=>$("#mc").classList.remove("viewing"); }
    const ta=$("#ta");
    ta.oninput=()=>{ ta.style.height="auto"; ta.style.height=Math.min(120,ta.scrollHeight)+"px"; };
    const send=()=>{ const txt=ta.value.trim(); if(!txt) return;
      t.msgs.push({from:"me",t:Date.now(),text:txt}); save(); paintThreads(); paintConvo(); };
    $("#send").onclick=send;
    $("#ta").onkeydown=e=>{ if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); send(); } };
  }
  function shortTime(ts){
    const d=new Date(ts), now=new Date();
    if(d.toDateString()===now.toDateString()) return d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
    const diff=(now-d)/864e5;
    if(diff<7) return d.toLocaleDateString([], {weekday:"short"});
    return d.toLocaleDateString([], {month:"short",day:"numeric"});
  }
}

/* ---------------- account menu ---------------- */
const menu = $("#acctMenu"), avatarBtn = $("#avatarBtn");
function drawMenu(){
  menu.innerHTML = '<h4>Display name</h4><div style="padding:0 10px"><input id="nameIn" placeholder="Your name" value="'+esc(S.name)+'"></div>'
    + '<hr><a href="#/my">My Clubs</a><a href="#/match">Seahawk Match</a>'
    + '<hr><button id="themeBtn"></button><button id="resetBtn">Reset saved data</button>'
    + '<hr><a href="#/privacy">Privacy</a><a href="#/terms">Terms</a>';
  const t = document.documentElement.getAttribute("data-theme");
  $("#themeBtn").textContent = t==="dark" ? "Use light theme" : t==="light" ? "Match system theme" : "Use dark theme";
  $("#themeBtn").onclick = ()=>{
    const cur=document.documentElement.getAttribute("data-theme");
    const next = cur==="dark" ? "light" : cur==="light" ? null : "dark";
    if(next) document.documentElement.setAttribute("data-theme",next);
    else document.documentElement.removeAttribute("data-theme");
    try{ next? localStorage.setItem(KEY+"-theme",next) : localStorage.removeItem(KEY+"-theme"); }catch(e){}
    drawMenu();
  };
  $("#nameIn").oninput = e=>{ S.name=e.target.value; save(); renderNav(); };
  $("#resetBtn").onclick = ()=>{
    S = Object.assign({},DEFAULTS); save(); activeThread=null; closeMenu(); renderNav();
    showDialog("Saved data cleared","Your clubs, match answers and messages have been removed from this browser.");
    router();
  };
}
function openMenu(){ drawMenu(); menu.hidden=false; avatarBtn.setAttribute("aria-expanded","true"); }
function closeMenu(){ menu.hidden=true; avatarBtn.setAttribute("aria-expanded","false"); }
avatarBtn.onclick = e=>{ e.stopPropagation(); menu.hidden ? openMenu() : closeMenu(); };
document.addEventListener("click", e=>{ if(!menu.hidden && !menu.contains(e.target)) closeMenu(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeMenu(); });
menu.addEventListener("click", e=>{ if(e.target.tagName==="A") closeMenu(); });

function showDialog(title,body){
  $("#dlgTitle").textContent=title; $("#dlgBody").innerHTML='<p>'+esc(body)+'</p>';
  const d=$("#dlg"); d.showModal(); $("#dlgClose").onclick=()=>d.close();
}

/* ---------------- boot ---------------- */
try{ const th=localStorage.getItem(KEY+"-theme"); if(th) document.documentElement.setAttribute("data-theme",th); }catch(e){}
seedThreads();
router();
</script>
