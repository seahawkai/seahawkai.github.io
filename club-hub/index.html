<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seahawk Club Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B2F4E; --navy-2:#123D63;
  --blue:#14507E; --blue-2:#1F6FA8; --blue-3:#3E88C2;
  --teal:#0F7C7A; --teal-2:#139391;
  --green:#277556; --green-2:#3A9469;
  --sky:#E2EDF5; --sky-2:#CFE0EC; --mint:#DDEFE5; --mint-2:#C4E3D2;
  --paper:#F3F7F8; --panel:#FFFFFF; --panel-2:#EAF0F3;
  --line:#D3DDE3; --line-2:#B9C8D1;
  --ink:#0F2333; --ink-2:#435869; --ink-3:#6B7F8F;
  --on-dark:#FFFFFF; --on-dark-2:#C5D7E6; --on-dark-3:#94AFC5;
  --warn:#9A5B12; --warn-soft:#F6EAD6; --warn-line:#E2C79C;
  --b-navy:#0B2F4E; --b-blue:#14507E; --b-teal:#0F7C7A; --b-green:#277556; --on-accent:#FFFFFF;
  --r-s:4px; --r-m:6px; --r-l:8px;
  --nav-h:58px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --navy:#0A1C2B; --navy-2:#0F2638;
    --blue:#6FAEE0; --blue-2:#8FC1EA; --blue-3:#AFD3F0;
    --teal:#4FC0BD; --teal-2:#6FD0CD; --green:#6BC49A; --green-2:#8AD4B0;
    --sky:#152A3B; --sky-2:#1C3548; --mint:#132C22; --mint-2:#1A3B2D;
    --paper:#0F171D; --panel:#16212A; --panel-2:#1D2A34;
    --line:#26363F; --line-2:#34464F;
    --ink:#E3ECF0; --ink-2:#A4B6C1; --ink-3:#7F929E;
    --warn:#DDAA62; --warn-soft:#2A2116; --warn-line:#4B3A22;
    --b-navy:#0A1C2B; --b-blue:#123E63; --b-teal:#0E4F4E; --b-green:#184A37; --on-accent:#07192A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --navy:#0A1C2B; --navy-2:#0F2638;
  --blue:#6FAEE0; --blue-2:#8FC1EA; --blue-3:#AFD3F0;
  --teal:#4FC0BD; --teal-2:#6FD0CD; --green:#6BC49A; --green-2:#8AD4B0;
  --sky:#152A3B; --sky-2:#1C3548; --mint:#132C22; --mint-2:#1A3B2D;
  --paper:#0F171D; --panel:#16212A; --panel-2:#1D2A34;
  --line:#26363F; --line-2:#34464F;
  --ink:#E3ECF0; --ink-2:#A4B6C1; --ink-3:#7F929E;
  --warn:#DDAA62; --warn-soft:#2A2116; --warn-line:#4B3A22;
  --b-navy:#0A1C2B; --b-blue:#123E63; --b-teal:#0E4F4E; --b-green:#184A37; --on-accent:#07192A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--nav-h) + env(safe-area-inset-top,0px) + 8px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Libre Franklin",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-weight:600;margin:0;line-height:1.18;letter-spacing:-.01em}
h1{font-size:34px}h2{font-size:21px}h3{font-size:16.5px}
p{margin:0 0 .8em}
a{color:var(--blue-2);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.fade{animation:fadein .22s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--b-navy);color:var(--on-dark)}
.topbar-in{max-width:1200px;margin:0 auto;height:var(--nav-h);display:flex;align-items:center;gap:28px;padding:0 20px}
.wordmark{font-family:"Source Serif 4",Georgia,serif;font-weight:700;font-size:19.5px;color:var(--on-dark);white-space:nowrap;letter-spacing:-.015em}
.wordmark span{color:#7FD3A8}
.wordmark:hover{text-decoration:none}
.mainnav{display:flex;gap:2px;flex:1;height:100%}
.mainnav a{display:flex;align-items:center;padding:0 12px;font-size:14px;font-weight:500;color:var(--on-dark-2);border-bottom:3px solid transparent;border-top:3px solid transparent}
.mainnav a:hover{color:var(--on-dark);text-decoration:none;background:rgba(255,255,255,.06)}
.mainnav a.on{color:var(--on-dark);border-bottom-color:#5CC293;font-weight:600}
.nav-badge{display:inline-block;min-width:17px;height:17px;padding:0 4px;margin-left:6px;border-radius:9px;background:#5CC293;color:#08251A;font-size:11px;font-weight:700;line-height:17px;text-align:center}
.avatar{width:32px;height:32px;border-radius:50%;background:#2E8E63;color:#fff;border:2px solid rgba(255,255,255,.25);display:grid;place-items:center;font-size:12.5px;font-weight:700;cursor:pointer;flex:none}
.acct{position:relative}
.menu{position:absolute;right:0;top:42px;width:236px;background:var(--panel);color:var(--ink);border:1px solid var(--line-2);border-radius:var(--r-l);box-shadow:0 10px 28px rgba(8,25,40,.22);padding:6px;z-index:50}
.menu h4{font-family:inherit;font-size:11.5px;font-weight:600;color:var(--ink-3);padding:8px 10px 3px;margin:0;text-transform:uppercase;letter-spacing:.06em}
.menu button,.menu a{display:block;width:100%;text-align:left;padding:7px 10px;border:0;background:none;font-size:14px;border-radius:var(--r-s);cursor:pointer;color:var(--ink)}
.menu button:hover,.menu a:hover{background:var(--panel-2);text-decoration:none}
.menu input{width:100%;padding:6px 8px;margin:2px 0 6px;border:1px solid var(--line-2);border-radius:var(--r-s);background:var(--paper);color:var(--ink);font-size:14px}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.botnav{display:none}

/* ---------- page bands ---------- */
.band{background:var(--b-navy);color:var(--on-dark)}
.band-in{max-width:1200px;margin:0 auto;padding:30px 20px 28px}
.band h1{color:var(--on-dark)}
.band p{color:var(--on-dark-2)}
.band a{color:#9FD8BE}
.band a.btn-light{color:var(--b-navy)} .band a.btn-go,.band a.btn-pri{color:var(--on-accent)} .band a.btn-ghost{color:var(--on-dark)}
.band a.btn:hover{text-decoration:none}
.band-blue{background:var(--b-blue)}
.band-teal{background:var(--b-teal)}
.band-green{background:var(--b-green)}
.band-slim .band-in{padding:22px 20px 20px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8FD9B6;margin-bottom:8px}
.band-teal .eyebrow,.band-green .eyebrow{color:#D4F2E3}
.lede{font-size:16px;max-width:52ch;margin-bottom:0}


#view{min-height:calc(100vh - var(--nav-h) - 96px)}
.wrap{max-width:1200px;margin:0 auto;padding:26px 20px 60px}
.narrow{max-width:780px}

/* ---------- generic ---------- */
.muted{color:var(--ink-2)} .dim{color:var(--ink-3)} .small{font-size:13px} .xs{font-size:12px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin:0 0 12px}
.sec-head h2{font-size:20px}
.sec-head .kicker{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m)}
.pad{padding:16px 18px}
.crumb{font-size:13px;color:var(--on-dark-2);margin-bottom:12px;display:inline-block}
.crumb:hover{color:var(--on-dark)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 15px;border-radius:var(--r-s);border:1px solid var(--line-2);background:var(--panel);color:var(--ink);font-size:14px;font-weight:500;cursor:pointer;transition:background .12s,border-color .12s,color .12s;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--panel-2);text-decoration:none}
.btn-pri{background:var(--blue);border-color:var(--blue);color:var(--on-accent)}
.btn-pri:hover{background:var(--navy-2);border-color:var(--navy-2)}
.btn-go{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.btn-go:hover{background:#1E5F45;border-color:#1E5F45}
.btn-on{background:var(--mint);border-color:var(--green-2);color:var(--green)}
.btn-ghost{background:transparent;border-color:rgba(255,255,255,.35);color:var(--on-dark)}
.btn-ghost:hover{background:rgba(255,255,255,.1)}
.btn-light{background:#fff;border-color:#fff;color:var(--navy)}
.btn-light:hover{background:#E8F1F7;border-color:#E8F1F7}

.btn-sm{padding:5px 11px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:default}
.linkbtn{background:none;border:0;padding:0;color:var(--blue-2);cursor:pointer;font-size:14px}
.linkbtn:hover{text-decoration:underline}

.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--panel-2);color:var(--ink-2);border:1px solid transparent;white-space:nowrap}
.chip-blue{background:var(--sky);color:var(--blue);border-color:var(--sky-2)}
.chip-green{background:var(--mint);color:var(--green);border-color:var(--mint-2)}
.chip-teal{background:var(--teal);color:#fff}
.chip-warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.chip-x{cursor:pointer}
.chip-x b{font-weight:600;margin-left:2px;opacity:.7}
.chip-x:hover b{opacity:1}
.meta{font-size:13px;color:var(--ink-2)}
.meta>span+span::before{content:"·";margin:0 7px;color:var(--ink-3)}
.mono{width:38px;height:38px;border-radius:var(--r-s);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13.5px;flex:none;letter-spacing:.02em;font-family:"Libre Franklin",sans-serif}
.mono-lg{width:64px;height:64px;font-size:22px;border-radius:var(--r-m);border:2px solid rgba(255,255,255,.35)}

.field{width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r-s);background:var(--panel);color:var(--ink);font:inherit;font-size:14.5px}
.field::placeholder{color:var(--ink-3)}
.field:focus{outline:2px solid var(--teal);outline-offset:-1px;border-color:var(--teal)}
textarea.field{resize:vertical}
select.field{padding:7px 9px;width:auto}

/* ---------- toggles & segmented ---------- */
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.tg{display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);font-size:13.5px;cursor:pointer;color:var(--ink);transition:background .12s,border-color .12s,color .12s;user-select:none}
.tg:hover{border-color:var(--teal)}
.tg.on{background:var(--teal);border-color:var(--teal);color:var(--on-accent);font-weight:500}

.tg input{position:absolute;opacity:0;width:0;height:0}
.tg:focus-within{outline:2px solid var(--teal);outline-offset:2px}
.tg .n{margin-left:6px;font-size:11.5px;opacity:.7;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-s);overflow:hidden;background:var(--panel)}
.seg button{padding:6px 13px;border:0;background:transparent;font-size:13.5px;cursor:pointer;border-left:1px solid var(--line-2);white-space:nowrap;color:var(--ink)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--blue);color:var(--on-accent);font-weight:600}

.seg-dark{border-color:rgba(255,255,255,.3);background:transparent}
.seg-dark button{color:var(--on-dark-2);border-left-color:rgba(255,255,255,.2)}
.seg-dark button.on{background:#fff;color:var(--navy)}
.segn{margin-left:6px;font-variant-numeric:tabular-nums;opacity:.75}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.days .tg{justify-content:center;padding:6px 0;border-radius:var(--r-s)}
.seg-grid{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));width:100%}
.seg-grid button{padding:6px 4px;text-align:center}
.ftoggle{display:none}

/* ---------- home ---------- */
.hero .band-in{padding:40px 20px 36px}
.hero h1{font-size:44px;letter-spacing:-.02em;margin-bottom:8px}
.hero-search{display:flex;gap:8px;max-width:640px;margin-top:22px}
.hero-search .field{flex:1;border-color:transparent;padding:12px 14px;font-size:15px}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;justify-content:space-between;min-height:84px;padding:13px 14px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--panel);color:var(--ink);transition:border-color .12s,background .12s}
.tile:hover{text-decoration:none;border-color:var(--teal);background:var(--sky)}
.tile b{font-size:14.5px;font-weight:600;line-height:1.25}
.tile .n{font-family:"Source Serif 4",Georgia,serif;font-size:24px;font-weight:700;color:var(--blue)}
.tile:nth-child(3n+2) .n{color:var(--teal)}
.tile:nth-child(3n) .n{color:var(--green)}
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.wday{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:11px 12px;min-width:0}
.wday.today{border-color:var(--teal);box-shadow:inset 0 3px 0 var(--teal)}
.wday h4{font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px;display:flex;justify-content:space-between}
.wday.today h4{color:var(--teal)}
.wday a{display:block;padding:5px 0;border-top:1px solid var(--line);color:var(--ink);font-size:13px;line-height:1.3}
.wday a:first-of-type{border-top:0}
.wday a:hover{color:var(--blue-2);text-decoration:none}
.wday a small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:1px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:32px;align-items:start}
.aside{display:flex;flex-direction:column;gap:16px}
.aside .panel h3{margin-bottom:8px}
.promo{background:var(--sky);border:1px solid var(--sky-2);border-radius:var(--r-m);padding:18px}
.promo h3{color:var(--blue)}
.upnext{list-style:none;margin:0;padding:0}
.upnext li{display:flex;gap:11px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.upnext li:last-child{border-bottom:0}
.dot{width:9px;height:9px;border-radius:2px;flex:none;display:inline-block}
.when{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:auto}

/* ---------- directory ---------- */
.dir-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
.dir-top .field{max-width:420px;border-color:transparent}
.dircols{display:grid;grid-template-columns:250px minmax(0,1fr);gap:30px;align-items:start}
.filters{position:sticky;top:calc(var(--nav-h) + env(safe-area-inset-top,0px) + 16px)}
.fgroup{padding:0 0 16px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.fgroup:last-child{border-bottom:0}
.fhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.fhead h4{font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);margin:0}
.fopt{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);padding:3px 0;cursor:pointer}
.fopt input{margin:0;accent-color:var(--teal)}
.fopt .n{margin-left:auto;color:var(--ink-3);font-size:12px}
.activebar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.activebar:empty{display:none}
.resbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.count{font-family:"Source Serif 4",Georgia,serif;font-size:19px;font-weight:600}
.clublist{display:flex;flex-direction:column;gap:6px}
.crow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:13px;align-items:center;padding:11px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);color:inherit;transition:border-color .12s,background .12s}
.crow:hover{text-decoration:none;border-color:var(--blue-3);background:var(--panel)}
.crow:hover .cname{color:var(--blue-2)}
.cname{font-weight:600;font-size:15px;color:var(--ink);line-height:1.3}
.cline{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:1px 0 4px}
.crow .meta{display:flex;flex-wrap:wrap;gap:0}
.cright{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.view{font-size:12.5px;font-weight:600;color:var(--blue-2);white-space:nowrap}
.cat{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--teal)}

/* ---------- skeleton ---------- */
.sk{background:var(--panel-2);border-radius:var(--r-s);animation:pulse 1.25s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.skrow{padding:14px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--panel);margin-bottom:6px}
.skrow .sk+.sk{margin-top:7px}

/* ---------- club detail ---------- */
.club-band .band-in{padding-top:22px}
.club-id{display:flex;gap:18px;align-items:center}
.club-id h1{font-size:34px;max-width:24ch}
.facts{display:flex;flex-wrap:wrap;gap:0;margin-top:20px;border-top:1px solid rgba(255,255,255,.22);padding-top:16px}
.fact{padding-right:30px;margin-bottom:6px;min-width:0}
.fact dt{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-bottom:3px}
.fact dd{margin:0;font-size:15px;font-weight:600;color:#fff}
.fact dd small{display:block;font-weight:400;font-size:13px;color:rgba(255,255,255,.8)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.dsec{margin-bottom:26px}
.dsec h2{font-size:18px;margin-bottom:8px}
.fitlist{list-style:none;margin:0;padding:0}
.fitlist li{padding:8px 0 8px 22px;border-bottom:1px solid var(--line);position:relative;font-size:14.5px}
.fitlist li:last-child{border-bottom:0}
.fitlist li::before{content:"";position:absolute;left:3px;top:15px;width:8px;height:8px;border-radius:2px;background:var(--teal)}
.people{list-style:none;padding:0;margin:0;font-size:14px}
.people li{padding:6px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.people li:last-child{border-bottom:0}
.people .role{color:var(--ink-3);font-size:12.5px}

/* ---------- schedule ---------- */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--on-dark-2);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px}
.sched-band{margin-top:22px}
.band-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;border-radius:var(--r-m) var(--r-m) 0 0;padding:10px 14px;color:#fff}
.band-head h2{font-size:17px;color:#fff}
.band-head span{font-size:13px;opacity:.85;font-variant-numeric:tabular-nums}
.bh-before{background:var(--b-teal)} .bh-after{background:var(--b-blue)} .bh-other{background:#3C5A74}


.weekgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r-m) var(--r-m);background:var(--panel);overflow:hidden}
.daycol{border-left:1px solid var(--line);padding:11px 10px 14px;min-width:0}
.daycol:first-child{border-left:0}
.daycol h4{font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 9px;display:flex;justify-content:space-between}
.daycol.today h4{color:var(--teal)}
.evt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:4px solid var(--c,var(--blue));border-radius:var(--r-s);background:var(--paper);padding:7px 9px;margin-bottom:7px;cursor:pointer;transition:background .12s}
.evt:hover{background:var(--sky)}
.evt .nm{display:block;font-size:13px;font-weight:600;line-height:1.3;overflow-wrap:break-word;color:var(--ink)}
.evt .tm{display:block;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-top:2px}
.evt .rm{display:block;font-size:12px;color:var(--ink-3)}
.evt.mine{background:var(--mint)}
.evt .warnk{display:block;color:var(--warn);font-size:11.5px;font-weight:600;margin-top:3px}
.evt.clash{border-color:var(--warn-line);border-left-color:var(--c)}
.evt.soft{border-style:dashed;border-left-style:solid;background:transparent}
.also{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line-2)}
.also h5{font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 7px}
.bandempty{border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r-m) var(--r-m);background:var(--panel);padding:18px 14px;font-size:13.5px;color:var(--ink-3)}

/* ---------- match ---------- */
.steps{display:flex;align-items:center;gap:12px;margin-top:18px}
.steps .track{flex:1;max-width:420px;height:6px;background:rgba(255,255,255,.22);border-radius:3px;overflow:hidden}
.steps .track i{display:block;height:100%;background:#fff;border-radius:3px;transition:width .25s ease}
.steps span{font-size:13px;color:#E3F4F3;font-variant-numeric:tabular-nums;white-space:nowrap}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);padding:26px 26px 22px;margin-top:-18px;position:relative}
.qcard h2{font-size:24px;margin-bottom:4px}
.qcard .qs{font-size:13.5px;color:var(--ink-3);margin-bottom:18px}
.qnav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}
.picked{font-size:12.5px;color:var(--ink-3)}
.ring{flex:none}
.ring text{font-family:"Source Serif 4",Georgia,serif;font-weight:700}
.top-match{display:grid;grid-template-columns:auto minmax(0,1fr) 250px;gap:24px;align-items:start;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:var(--r-l);padding:22px}
.top-match h2{font-size:24px;margin:2px 0 4px}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:12.5px}
.bar{height:7px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--teal)}
.bar i.lo{background:var(--line-2)}
.bars .v{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:12px;text-align:right;min-width:22px}
.why{list-style:none;margin:10px 0 0;padding:0;font-size:13.5px;color:var(--ink-2)}
.why li{padding-left:16px;position:relative;margin-bottom:3px;line-height:1.45}
.why li::before{content:"";position:absolute;left:2px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--green-2)}
.why li.con{color:var(--ink-3)}
.why li.con::before{background:var(--warn);border-radius:1px}
.mres{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m)}
.score{font-family:"Source Serif 4",Georgia,serif;font-weight:700;font-size:22px;color:var(--blue);line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:12px}
.mini{display:flex;gap:2px;margin-top:6px;width:52px}
.mini i{flex:1;height:5px;border-radius:1px;background:var(--line-2)}
.mini i.hi{background:var(--teal)} .mini i.mid{background:var(--blue-3)}
details.whyd summary{cursor:pointer;font-size:12.5px;color:var(--blue-2);list-style:none;margin-top:4px}
details.whyd summary::-webkit-details-marker{display:none}
details.whyd[open] summary{color:var(--ink-3)}
.progressbar{height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden;max-width:360px}
.progressbar i{display:block;height:100%;background:var(--teal);transition:width .25s linear}

/* ---------- my clubs ---------- */
.nextup{display:flex;gap:16px;align-items:center;margin-top:18px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:var(--r-m);padding:14px 16px;max-width:640px}
.nextup .lbl{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#CDEEDC}
.nextup b{display:block;font-size:17px;color:#fff}
.nextup span{color:#E0F3EA;font-size:13.5px}
.statebar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.statebar button{display:flex;align-items:baseline;gap:8px;padding:8px 13px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-s);cursor:pointer;font-size:13.5px}
.statebar button b{font-family:"Source Serif 4",Georgia,serif;font-size:18px;color:var(--blue)}
.statebar button.on{border-color:var(--teal);background:var(--sky)}
.statebar button:hover{border-color:var(--teal)}
.empty{border:1px dashed var(--line-2);border-radius:var(--r-m);padding:28px 24px;color:var(--ink-2);font-size:14px;background:var(--panel)}
.empty h3{margin-bottom:5px;color:var(--ink)}
.notice{background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--warn);border-radius:var(--r-s);padding:9px 12px;font-size:13px}
.info{background:var(--sky);border:1px solid var(--sky-2);color:var(--blue);border-radius:var(--r-s);padding:9px 12px;font-size:13px}

/* ---------- messages ---------- */
.msgcols{display:grid;grid-template-columns:290px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;background:var(--panel);height:min(620px,calc(100vh - 250px));min-height:420px}
.threads{border-right:1px solid var(--line);overflow-y:auto;background:var(--paper)}
.thread{display:block;width:100%;text-align:left;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer}
.thread:hover{background:var(--panel-2)}
.thread.on{background:var(--panel);box-shadow:inset 3px 0 0 var(--teal)}
.thread-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.thread-name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thread.unread .thread-name::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal);margin-left:7px;vertical-align:1px}
.thread-prev{font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.convo{display:flex;flex-direction:column;min-width:0}
.convo-head{padding:11px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.bubbles{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:12px;background:var(--paper)}
.bub{max-width:min(78%,52ch);font-size:14px}
.bub .who{font-size:11.5px;color:var(--ink-3);margin-bottom:3px}
.bub .txt{padding:9px 12px;border-radius:var(--r-m);background:var(--panel);border:1px solid var(--line)}
.bub.me{align-self:flex-end}
.bub.me .who{text-align:right}
.bub.me .txt{background:var(--b-blue);border-color:var(--b-blue);color:#fff}

.composer{border-top:1px solid var(--line);padding:11px 14px;display:flex;gap:9px;align-items:flex-end;background:var(--panel)}
.composer textarea{flex:1;resize:none;min-height:40px;max-height:120px;padding:9px 11px;border:1px solid var(--line-2);border-radius:var(--r-s);background:var(--paper);color:var(--ink);font:inherit;font-size:14px}

/* ---------- legal ---------- */
.legal h2{font-size:18px;margin:24px 0 7px}
.legal ul{padding-left:20px} .legal li{margin-bottom:5px}

/* ---------- footer ---------- */
.foot{background:var(--b-navy);color:var(--on-dark-3);margin-top:10px}
.foot-in{max-width:1200px;margin:0 auto;padding:22px 20px 30px;display:flex;justify-content:space-between;gap:22px;flex-wrap:wrap;font-size:13px}
.foot a{color:var(--on-dark-2)}
.foot nav{display:flex;gap:18px}
.credit{margin-top:5px;font-size:12px;color:var(--on-dark-3)}

/* ---------- dialog & toast ---------- */
dialog{border:1px solid var(--line-2);border-radius:var(--r-l);padding:0;background:var(--panel);color:var(--ink);max-width:470px;width:calc(100% - 32px);box-shadow:0 16px 44px rgba(8,25,40,.28)}
dialog::backdrop{background:rgba(8,22,34,.45)}
.dlg-head{padding:16px 18px 0;display:flex;gap:12px;align-items:center}
.dlg-body{padding:10px 18px 0;font-size:14px}
.dlg-foot{padding:16px 18px;display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,14px);z-index:90;background:var(--b-navy);color:#fff;padding:10px 16px;border-radius:var(--r-s);font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:88vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--warn)}

/* ---------- responsive ---------- */
@media (max-width:1000px){
  .weekgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .daycol{border-top:1px solid var(--line)}
  .daycol:nth-child(odd){border-left:0}
  .daycol:first-child,.daycol:nth-child(2){border-top:0}
  .week{grid-template-columns:repeat(3,minmax(0,1fr))}
  .top-match{grid-template-columns:auto minmax(0,1fr)}
  .top-match>.bars-wrap{grid-column:1/-1}
}
@media (max-width:900px){
  .cols,.dircols{grid-template-columns:minmax(0,1fr);gap:24px}
  .filters{position:static}
  .filters.collapsed{display:none}
  .ftoggle{display:inline-flex}
  .msgcols{grid-template-columns:minmax(0,1fr);height:auto}
  .threads{border-right:0;border-bottom:1px solid var(--line)}
  .msgcols.viewing .threads{display:none}
  .msgcols:not(.viewing) .convo{display:none}
  .bubbles{min-height:300px}
}
@media (max-width:720px){
  .mainnav{display:none}
  .topbar-in{justify-content:space-between;gap:12px}
  .botnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--b-navy);padding-bottom:env(safe-area-inset-bottom,0px)}
  .botnav a{flex:1;text-align:center;padding:10px 2px 11px;font-size:11px;font-weight:500;color:var(--on-dark-3);border-top:3px solid transparent}
  .botnav a.on{color:#fff;border-top-color:#5CC293;font-weight:600}
  .botnav a:hover{text-decoration:none}
  body{padding-bottom:60px}
  .wrap{padding:20px 16px 40px}
  .band-in,.hero .band-in{padding:24px 16px 22px}
  h1,.club-id h1{font-size:27px}
  .hero h1{font-size:32px}
  .week{grid-template-columns:minmax(0,1fr)}
  .crow{grid-template-columns:auto minmax(0,1fr);}
  .cright{grid-column:2;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:flex-start}
  .cright:empty{display:none}
  .crow .view{display:none}
  .qcard{padding:20px 16px}
  .top-match{grid-template-columns:minmax(0,1fr)}
  .mres{grid-template-columns:48px minmax(0,1fr)}
  .mres>.cright{grid-column:2}
  .fact{padding-right:20px}
}
@media (max-width:640px){
  .weekgrid{grid-template-columns:minmax(0,1fr)}
  .daycol{border-left:0!important;border-top:1px solid var(--line)!important}
  .daycol:first-child{border-top:0!important}
  .daycol.none{display:none}
}

</style>
</head>

/* Storage adapter for the published web page: everything stays in this browser. */
const STORE=(function(){
  const KEY="slhs-club-hub-v3";
  function fresh(){ return {name:"",states:{},threads:null,match:null}; }
  function load(){
    try{ const r=localStorage.getItem(KEY); if(r) return Object.assign(fresh(),JSON.parse(r)); }catch(e){}
    const d=fresh();
    try{ // carry over lists saved by the earlier version of the site
      const o=JSON.parse(localStorage.getItem("slhs-club-hub-v1")||"null");
      if(o){ const fix=id=>{ const m=/^c(\d+)$/.exec(id); return m?"c"+String(m[1]).padStart(3,"0"):id; };
        d.name=o.name||""; (o.joined||[]).forEach(id=>d.states[fix(id)]="planning"); (o.interested||[]).forEach(id=>d.states[fix(id)]="interested"); }
    }catch(e){}
    return d;
  }
  let d=load();
  const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){} };
  function seed(){
    if(d.threads) return;
    const now=Date.now(), hr=36e5, day=24*hr;
    // Sample replies only restate facts from the activities sheet.
    d.threads=[
      {clubId:"c007",unread:true,msgs:[
        {from:"me",t:now-6*hr,text:"Do I need debate experience to come to a meeting?"},
        {from:"them",t:now-5*hr,text:"No. We meet in the Library from 3:00 to 4:30 on Thursdays, and you can come as often or as little as you like."}]},
      {clubId:"c027",unread:false,msgs:[
        {from:"me",t:now-3*day,text:"When can I apply to NHS?"},
        {from:"them",t:now-3*day+50*60e3,text:"It is by application for juniors and seniors with a 3.7 GPA or higher."}]}
    ].filter(t=>CLUBS.some(c=>c.id===t.clubId));
    save();
  }
  seed();
  return {
    mode:"prototype",
    signedIn:true,
    canRename:true,
    name:()=>d.name,
    setName:n=>{ d.name=n; save(); },
    states:()=>d.states,
    setState:async(id,st)=>{ if(st) d.states[id]=st; else delete d.states[id]; save(); return Object.assign({},d.states); },
    requestParticipation:async(id)=>{ const dup=d.states[id]==="requested"; d.states[id]="requested"; save(); return {status:"pending",duplicate:dup}; },
    threads:()=>d.threads||[],
    markRead:id=>{ (d.threads||[]).forEach(t=>{ if(t.clubId===id) t.unread=false; }); save(); },
    sendMessage:async(id,text)=>{
      let t=d.threads.find(x=>x.clubId===id); if(!t){ t={clubId:id,unread:false,msgs:[]}; d.threads.unshift(t); }
      t.msgs.push({from:"me",t:Date.now(),text}); save(); return {threads:d.threads,toast:"Saved in this browser."};
    },
    match:()=>d.match,
    saveMatch:async m=>{ d.match=m; save(); },
    clearMatch:async()=>{ d.match=null; save(); },
    scope:[],
    reviewQueue:async()=>[],
    review:async()=>[],
    reset:async()=>{ d=fresh(); save(); seed(); },
    links:{privacy:"#/privacy",terms:"#/terms"},
    participateNote:"Prototype: your request is saved in this browser and not sent to anyone.",
    messageNote:"Prototype: messages stay in this browser and are not delivered.",
    privacyHTML:'<h2>What this prototype stores</h2><p>Everything stays in your browser: saved clubs, Seahawk Match answers, your display name and messages. Nothing is sent to a server, and clearing browser data removes it.</p>'
      +'<h2>What a real version would store</h2><ul><li>Your school sign-in, so your list follows you between devices.</li><li>Participation requests, so a sponsor can add you.</li><li>Messages to a club, so the sponsor can reply.</li></ul>',
    initialHash:""
  };
})();

const $ = (s,r) => (r||document).querySelector(s);
const $$ = (s,r) => Array.prototype.slice.call((r||document).querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function clock(m, withAp){
  let h=Math.floor(m/60), mm=m%60; const ap=h<12?"AM":"PM"; h=h%12||12;
  return h+":"+String(mm).padStart(2,"0")+(withAp?" "+ap:"");
}
function timeText(c){
  const m=c.meeting;
  if(m.start!=null){
    if(m.end==null) return clock(m.start,true);
    const sameHalf=(m.start<720)===(m.end<720);
    return clock(m.start,!sameHalf)+"\u2013"+clock(m.end,true);
  }
  if(c.when==="before") return "Before school";
  if(c.when==="after") return "After school";
  return "";
}
function dayShort(c){
  const d=c.meeting.days; if(!d.length) return "";
  if(c.meeting.vary) return d.join(" or ");
  if(d.length===4 && d.join()==="Mon,Tue,Wed,Thu") return "Mon\u2013Thu";
  return d.join(d.length===2?" & ":", ");
}
function dayLong(c){
  const d=c.meeting.days.map(x=>DAY_FULL[x]); if(!d.length) return "";
  if(c.meeting.vary) return "Usually "+d.join(" or ");
  if(d.length===1) return d[0]+"s";
  return d.slice(0,-1).join(", ")+" and "+d[d.length-1];
}
function metaParts(c){ return [dayShort(c), timeText(c), c.meeting.place].filter(Boolean); }
function metaHTML(c){ const p=metaParts(c); return p.length? '<span class="meta">'+p.map(x=>'<span>'+esc(x)+'</span>').join("")+'</span>' : ""; }
function initials(name){
  const y=name.match(/Class of (\d{4})/); if(y) return "\u2019"+y[1].slice(2);
  const ab=name.match(/\(([A-Z]{2,4})\)/); if(ab) return ab[1];
  if(/^[A-Z]{2,5}$/.test(name.split(/\W/)[0])) return name.split(/\W/)[0].slice(0,4);
  const skip={club:1,of:1,the:1,and:1,for:1,slhs:1,south:1,lakes:1,"&":1,"-":1,a:1,on:1,in:1};
  const w=name.replace(/\(.*?\)/g,"").split(/[\s\-\/]+/).filter(x=>x && !skip[x.toLowerCase()]);
  if(!w.length) return name.slice(0,2).toUpperCase();
  if(w.length===1) return w[0].slice(0,2).toUpperCase();
  return (w[0][0]+w[1][0]).toUpperCase();
}
function mono(c,cls){ return '<span class="mono '+(cls||"")+'" style="background:'+c.color+'" aria-hidden="true">'+esc(initials(c.name))+'</span>'; }
function oneLine(s){ if(!s) return ""; const m=s.match(/^(.+?[.!?])(\s|$)/); const f=(m?m[1]:s); return f.length>150? f.slice(0,147).replace(/\s+\S*$/,"")+"\u2026" : f; }

const isLater = id => LATER_STATES.indexOf(stateOf(id))>=0;
const myIds = pred => Object.keys(S.states).filter(id=>BY_ID[id] && pred(S.states[id]));

function toast(msg,bad){
  const el=$("#toast"); if(!el) return;
  el.textContent=msg; el.className="toast"+(bad?" bad":"")+" on";
  clearTimeout(toast._t); toast._t=setTimeout(()=>{el.className="toast";},3400);
}
function needSignIn(){
  if(STORE.signedIn) return false;
  toast("Sign in with your school Google account to do that.",true); return true;
}
async function setClubState(id,state){
  if(needSignIn()) return;
  const prev=S.states[id];
  if(state) S.states[id]=state; else delete S.states[id];
  try{ S.states = await STORE.setState(id,state||""); }
  catch(err){ if(prev) S.states[id]=prev; else delete S.states[id]; toast(String(err&&err.message||err),true); }
  router();
}

function skeletonRows(n){
  let h=""; for(let i=0;i<n;i++) h+='<div class="skrow"><div class="sk" style="height:12px;width:18%"></div><div class="sk" style="height:15px;width:'+(30+(i*13)%30)+'%"></div><div class="sk" style="height:12px;width:'+(55+(i*17)%30)+'%"></div></div>';
  return h;
}
function nextDate(day,start){
  const idx={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[day];
  const now=new Date(), d=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let delta=(idx-d.getDay()+7)%7;
  if(delta===0&&start!=null&&(now.getHours()*60+now.getMinutes())>start) delta=7;
  d.setDate(d.getDate()+delta); if(start!=null) d.setMinutes(start); return d;
}
function relDay(d){
  const now=new Date(), a=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const diff=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-a)/864e5);
  if(diff===0) return "Today"; if(diff===1) return "Tomorrow";
  return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
}
function upcoming(ids){
  const list=(ids?ids.map(i=>BY_ID[i]).filter(Boolean):CLUBS).filter(c=>c.meeting.days.length&&c.status==="active"&&!c.meeting.vary);
  const out=[]; list.forEach(c=>c.meeting.days.forEach(d=>{ if(d!=="Sat") out.push({club:c,day:d,date:nextDate(d,c.meeting.start)}); }));
  return out.sort((a,b)=>a.date-b.date);
}

/* ================= DIRECTORY ================= */
const F={q:"",tags:new Set(),tagMode:"all",cats:new Set(),days:new Set(),when:"",commit:"",openOnly:false,sort:"name"};

function filterClubs(list){
  const q=F.q.trim().toLowerCase();
  return list.filter(c=>{
    if(q){
      const hay=(c.name+" "+c.summary+" "+c.category+" "+c.sponsors.map(s=>s.name).join(" ")+" "
        +c.tags.map(t=>TAG_LABEL[t]).join(" ")+" "+c.meeting.place).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    if(F.tags.size){
      const sel=Array.from(F.tags);
      if(F.tagMode==="all" ? !sel.every(t=>c.tags.indexOf(t)>=0) : !sel.some(t=>c.tags.indexOf(t)>=0)) return false;
    }
    if(F.cats.size && !F.cats.has(c.category)) return false;
    if(F.days.size && !c.meeting.days.some(d=>F.days.has(d))) return false;
    if(F.when && c.when!==F.when) return false;
    if(F.commit && c.commitment!==F.commit) return false;
    if(F.openOnly && !(c.status==="active"||c.status==="pending")) return false;
    return true;
  });
}

  }
}

const TAG_FIT={academic:"care about academics",stem:"like science and technology",arts:"like making art, music or theatre",
  media:"want to write, film or publish",culture:"want to celebrate or learn about a culture",service:"want to volunteer",
  leadership:"want to lead",competition:"want to compete against other schools",business:"are curious about business",
  debate:"like debating or speaking up",civics:"care about politics or advocacy",wellness:"care about health and wellbeing",
  recreation:"want something fun and low-pressure",environment:"care about the environment",career:"are exploring a career"};
const ACT_FIT={building:"like building things",research:"like digging into research",speaking:"want to get comfortable speaking in front of people",
  teamwork:"like working on a team",performance:"like performing",tutoring:"like helping other students",creative:"like making things",
  social:"want to meet people",independent:"like working on your own",discussion:"like talking ideas through"};

const LEARN_SHORT={coding:"coding",science:"science",math:"math",engineering:"engineering",research:"research",writing:"writing",
  speaking:"public speaking",leadership:"leadership",art:"art and design",music:"music",business:"business",finance:"finance",
  culture:"culture",languages:"a language",service:"community service",media:"media",teamwork:"teamwork"};
function goodFit(c){
  const out=[];
  if(c.learn.length){ const l=c.learn.slice(0,3).map(x=>LEARN_SHORT[x]);
    out.push("want to work on "+(l.length<2?l[0]:l.slice(0,-1).join(", ")+" and "+l[l.length-1])); }
  c.acts.forEach(a=>{ if(ACT_FIT[a] && out.length<5 && !(a==="competition"||a==="leadership"||a==="volunteering")) out.push(ACT_FIT[a]); });
  c.tags.forEach(t=>{ if(TAG_FIT[t] && out.length<5) out.push(TAG_FIT[t]); });
  const seen={}; return out.filter(x=>seen[x]?false:(seen[x]=1)).slice(0,4);
}

/* ================= SEAHAWK MATCH ================= */
const GOALS=[["learn","Learning something new"],["skills","Developing new skills"],["academic","Exploring an academic interest"],
  ["career","Exploring a possible career"],["resume","Building my resume"],["college","College application involvement"],
  ["leadership","Leadership experience"],["service","Community service"],["competition","Competition experience"],
  ["meet","Meeting new people"],["friends","Making friends"],["build","Building projects"],["create","Creating something"],
  ["speaking","Improving public speaking"],["team","Working with a team"],["fun","Having fun and relaxing"],
  ["stretch","Trying something outside my comfort zone"]];
const LOADS=[["monthly","About once a month"],["twicemonth","Twice a month"],["weekly","Once a week"],["multi","Several days a week"]];
const LOAD_ORDER={monthly:0,twicemonth:1,weekly:2,multi:3};
const QUESTIONS=[
  {key:"interests",title:"What are you into?",hint:"Pick any that sound like you.",multi:true,opts:()=>Object.keys(TAG_LABEL).map(k=>[k,TAG_LABEL[k]])},
  {key:"learn",title:"What do you want to get better at?",hint:"Pick any.",multi:true,opts:()=>Object.keys(LEARN_LABEL).map(k=>[k,LEARN_LABEL[k]])},
  {key:"acts",title:"What do you like doing?",hint:"Pick any.",multi:true,opts:()=>Object.keys(ACT_LABEL).map(k=>[k,ACT_LABEL[k]])},
  {key:"goals",title:"What do you want out of a club?",hint:"Pick any.",multi:true,opts:()=>GOALS},
  {key:"days",title:"Which days are you free?",hint:"Skip if any day works.",multi:true,opts:()=>DAYS.map(d=>[d,DAY_FULL[d]])},
  {key:"when",title:"Before or after school?",hint:"",multi:false,opts:()=>[["","Either works"],["before","Before school"],["after","After school"]]},
  {key:"load",title:"How often do you want to meet?",hint:"",multi:false,opts:()=>[["","No preference"]].concat(LOADS)}
];

function goalSupport(c,g){
  const t=x=>c.tags.indexOf(x)>=0, a=x=>c.acts.indexOf(x)>=0;
  switch(g){
    case "learn": return c.learn.length?1:0;
    case "skills": return c.learn.length?1:0;
    case "academic": return (t("academic")||t("stem"))?1:0;
    case "career": return (t("career")||t("business"))?1:0;
    case "resume": case "college": return (t("service")||t("leadership")||t("competition")||a("leadership")||a("volunteering")||a("competition"))?1:0;
    case "leadership": return (t("leadership")||a("leadership"))?1:0;
    case "service": return (t("service")||a("volunteering"))?1:0;
    case "competition": return (t("competition")||a("competition"))?1:0;
    case "meet": case "friends": return a("social")?1:(a("teamwork")?0.5:0);
    case "build": return a("building")?1:0;
    case "create": return a("creative")?1:0;
    case "speaking": return a("speaking")?1:(a("performance")?0.5:0);
    case "team": return a("teamwork")?1:0;
    case "fun": return (t("recreation")||a("social"))?1:0;
    case "stretch": return (a("performance")||a("speaking")||a("competition"))?1:0;
  }
  return 0;
}

function scoreClub(c,A){
  const ov=(sel,have)=>sel.filter(x=>have.indexOf(x)>=0);
  const f={}, hit={}, mult=[];
  hit.interests=ov(A.interests,c.tags); f.Interests=A.interests.length?hit.interests.length/A.interests.length:0.5;
  hit.learn=ov(A.learn,c.learn);       f.Learning=A.learn.length?hit.learn.length/A.learn.length:0.5;
  hit.acts=ov(A.acts,c.acts);          f.Activities=A.acts.length?hit.acts.length/A.acts.length:0.5;
  const gs=A.goals.map(g=>[g,goalSupport(c,g)]);
  hit.goals=gs.filter(x=>x[1]>=1).map(x=>x[0]); hit.goalsMissed=gs.filter(x=>x[1]<=0).map(x=>x[0]);
  f.Goals=A.goals.length?gs.reduce((s,x)=>s+x[1],0)/A.goals.length:0.5;

  if(!c.meeting.days.length && c.when==="unknown"){ f.Availability=0.45; hit.avail="unknown"; }
  else{
    const dayOk=!A.days.length||!c.meeting.days.length||c.meeting.days.some(d=>A.days.indexOf(d)>=0);
    const timeOk=!A.when||c.when==="unknown"||c.when===A.when;
    f.Availability=(dayOk?(c.meeting.days.length?0.7:0.4):0.05)+(timeOk?(c.when!=="unknown"?0.3:0.1):0);
    hit.avail=!dayOk?"wrongday":!timeOk?"wrongtime":c.meeting.days.length?"fits":"timeonly";
    if(!dayOk) mult.push(0.72);
    if(!timeOk) mult.push(0.85);
  }
  if(!A.load||c.commitment==="unknown"){ f.Commitment=c.commitment==="unknown"?0.45:0.5; hit.commit="unknown"; }
  else{
    const d=Math.abs(LOAD_ORDER[c.commitment]-LOAD_ORDER[A.load]);
    f.Commitment=[1,0.6,0.2,0.05][d]; hit.commit=d===0?"exact":d===1?"close":"far";
    if(d===2) mult.push(0.85); if(d===3) mult.push(0.75);
  }
  if(c.status==="needs-sponsor") mult.push(0.75);
  if(c.status==="pending") mult.push(0.92);
  const W={Interests:30,Learning:15,Activities:15,Goals:15,Availability:15,Commitment:10};
  let total=Object.keys(W).reduce((s,k)=>s+W[k]*f[k],0);
  mult.forEach(x=>total*=x);
  const detail=((c.meeting.days.length?1:0)+(timeText(c)?1:0)+(c.meeting.place?1:0)+(c.summary?1:0))/4;
  total*=0.96+0.04*detail;
  const parts={}; Object.keys(W).forEach(k=>parts[k]=Math.round(f[k]*100));
  return {score:Math.round(Math.max(1,Math.min(100,total))),parts,hit};
}

function joinList(a){ return a.length<2?(a[0]||""):a.slice(0,-1).join(", ")+" and "+a[a.length-1]; }
function matchWhy(c,r,A){
  const good=[], bad=[], lc=s=>s.toLowerCase();
  const gname=k=>lc((GOALS.find(g=>g[0]===k)||["",""])[1]);
  if(r.hit.interests.length) good.push(joinList(r.hit.interests.map(k=>TAG_LABEL[k]))+" club");
  else if(A.interests.length) bad.push("Not about the interests you picked");
  if(r.hit.learn.length) good.push("Works on "+joinList(r.hit.learn.map(k=>lc(LEARN_LABEL[k]))));
  else if(A.learn.length) bad.push("Nothing listed that you wanted to learn");
  if(r.hit.acts.length) good.push("Involves "+joinList(r.hit.acts.map(k=>lc(ACT_LABEL[k]))));
  else if(A.acts.length) bad.push("Different kind of activity than you chose");
  if(r.hit.goals.length) good.push("Offers "+joinList(r.hit.goals.slice(0,3).map(gname)));
  if(A.goals.length && r.hit.goalsMissed.length===A.goals.length) bad.push("Doesn\u2019t offer what you want from a club");
  else if(r.hit.goalsMissed.length) bad.push("No sign of "+joinList(r.hit.goalsMissed.slice(0,2).map(gname)));
  const days=c.meeting.days.map(d=>DAY_FULL[d]);
  if(r.hit.avail==="fits") good.push("Meets "+joinList(days)+(timeText(c)?", "+lc(timeText(c)):""));
  if(r.hit.avail==="wrongday") bad.push("Meets "+joinList(days)+", which you marked busy");
  if(r.hit.avail==="wrongtime") bad.push("Meets "+(c.when==="before"?"before":"after")+" school");
  if(r.hit.avail==="unknown") bad.push("Meeting day not posted yet");
  if(r.hit.commit==="exact") good.push((LOADS.find(l=>l[0]===c.commitment)||["",""])[1]+", like you wanted");
  if(r.hit.commit==="far") bad.push("Meets "+lc((LOADS.find(l=>l[0]===c.commitment)||["",""])[1]));
  if(c.status==="needs-sponsor") bad.push("Needs a sponsor before it can meet");
  return {good:good.slice(0,4),bad:bad.slice(0,2)};
}

function runMatch(v,A){
  v.innerHTML='<section class="band band-teal"><div class="band-in"><div class="eyebrow">Seahawk Match</div><h1>Scoring every club\u2026</h1>'
    +'<div class="steps"><div class="track"><i id="pb" style="width:8%"></i></div><span id="pbl">Interests</span></div></div></section>'
    +'<div class="wrap">'+skeletonRows(4)+'</div>';
  const steps=[[32,"Interests and skills"],[58,"Activities and goals"],[82,"Days, times and commitment"],[100,"Ranking"]];
  let i=0;
  const tick=()=>{
    if(i>=steps.length){
      const res=CLUBS.filter(c=>c.status!=="inactive").map(c=>{const r=scoreClub(c,A);r.id=c.id;r.why=matchWhy(c,r,A);return r;})
        .sort((a,b)=>b.score-a.score);
      const strong=res.filter(r=>r.score>=45).slice(0,10);
      S.match={v:3,answers:JSON.parse(JSON.stringify(A)),results:strong.length>=5?strong:res.slice(0,5),at:Date.now()};
      STORE.saveMatch(S.match).catch(()=>{});
      MQ=null; matchResults($("#view")); return;
    }
    const s=steps[i++]; const pb=$("#pb"); if(pb){pb.style.width=s[0]+"%";$("#pbl").textContent=s[1];}
    pending=setTimeout(tick,260);
  };
  pending=setTimeout(tick,240);
}

    +'<circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="var(--panel-2)" stroke-width="7"/>'
    +'<circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="var(--teal)" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+circ.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+cx+' '+cx+')"/>'
    +'<text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" font-size="'+(size*0.27)+'" fill="var(--ink)">'+score+'<tspan font-size="'+(size*0.14)+'">%</tspan></text></svg>';
}

      +'<button data-s="interested" class="'+(schedScope==="interested"?"on":"")+'">Interested<span class="segn">'+later.length+'</span></button>'

    :'<div class="empty"><h3>'+(schedScope==="mine"?"No clubs yet":"Nothing saved")+'</h3><p style="margin:0">'

    if(d.length&&a.meeting.start<endOf(b)&&b.meeting.start<endOf(a)) clashes.push([a,b,d]);
  }
  const todo=ids.map(i=>BY_ID[i]).filter(c=>c.selective||c.status==="needs-sponsor"||!c.meeting.days.length);

  w.innerHTML='<div class="cols"><div>'
    +'<div class="statebar"><button data-f="" class="'+(!myFilter?"on":"")+'"><b>'+ids.length+'</b>All</button>'
      +STATE_ORDER.filter(s=>counts[s]).map(s=>'<button data-f="'+s+'" class="'+(myFilter===s?"on":"")+'"><b>'+counts[s]+'</b>'+esc(STATE_LABEL[s])+'</button>').join("")+'</div>'
    +'<div class="clublist">'+shown.map(c=>clubRow(c)).join("")+'</div>'
   +'</div><aside class="aside">'
    +(clashes.length?'<div class="panel pad"><h3>Conflicts</h3>'+clashes.map(x=>'<p class="small" style="margin:0 0 6px"><b>'+esc(x[0].name)+'</b> and <b>'+esc(x[1].name)+'</b> overlap on '+x[2].map(d=>DAY_FULL[d]).join(" and ")+'.</p>').join("")+'</div>':"")
    +(up.length>1?'<div class="panel pad"><h3>Coming up</h3><ul class="upnext">'+up.slice(1,5).map(e=>'<li><span class="dot" style="background:'+e.club.color+'"></span><a href="#/club/'+e.club.id+'">'+esc(e.club.name)+'</a><span class="when">'+relDay(e.date)+'</span></li>').join("")+'</ul></div>':"")
    +(todo.length?'<div class="panel pad"><h3>Check before you go</h3><ul class="people">'+todo.slice(0,5).map(c=>'<li><a href="#/club/'+c.id+'">'+esc(c.name)+'</a><span class="role">'+(c.status==="needs-sponsor"?"Needs a sponsor":c.selective?"Has requirements":"No day set")+'</span></li>').join("")+'</ul></div>':"")
    +'<div class="panel pad"><h3>Announcements</h3><p class="small muted" style="margin:0">Nothing new from your clubs.</p></div>'
   +'</aside></div>';
  $$(".statebar button",w).forEach(b=>b.onclick=()=>{myFilter=b.dataset.f;viewMy($("#view"));});
}

/* ================= MESSAGES ================= */
let activeThread=null;
function openThreadFor(clubId){
  if(needSignIn()) return;
  activeThread=clubId;
  if((location.hash||"")==="#/messages") router(); else location.hash="#/messages";
}
function viewMessages(v){
  const head='<section class="band band-blue band-slim"><div class="band-in"><div class="eyebrow">Messages</div><h1>Messages</h1></div></section>';
  if(!STORE.signedIn){ v.innerHTML=head+'<div class="wrap"><div class="empty"><h3>Sign in to message a club</h3><p style="margin:0">Messages go out from your school account.</p></div></div>'; return; }
  const threads=S.threads.slice();
  if(activeThread&&!threads.some(t=>t.clubId===activeThread)) threads.unshift({clubId:activeThread,msgs:[],draft:true});
  if(!threads.length){ v.innerHTML=head+'<div class="wrap"><div class="empty"><h3>No messages yet</h3><p style="margin:0">Open a club and tap <b>Message</b>.</p></div></div>'; return; }
  if(!activeThread||!threads.some(t=>t.clubId===activeThread)) activeThread=threads[0].clubId;
  v.innerHTML=head+'<div class="wrap">'
    +(STORE.messageNote?'<p class="info" style="margin-bottom:14px;max-width:760px">'+esc(STORE.messageNote)+'</p>':"")
    +'<div class="msgcols'+(window.innerWidth<=900?"":" viewing")+'" id="mc"><div class="threads" id="tl"></div><div class="convo" id="cv"></div></div></div>';
  paintList(); paintConvo();
  function paintList(){
    $("#tl").innerHTML=threads.map(t=>{
      const c=BY_ID[t.clubId]; if(!c) return "";
      const last=t.msgs[t.msgs.length-1];
      return '<button class="thread'+(t.clubId===activeThread?" on":"")+(t.unread?" unread":"")+'" data-t="'+t.clubId+'">'
        +'<div class="thread-top"><span class="thread-name">'+esc(c.name)+'</span><span class="xs dim">'+(last?shortTime(last.t):"")+'</span></div>'
        +'<div class="thread-prev">'+(last?esc((last.from==="me"?"You: ":"")+last.text):'<span class="dim">New message</span>')+'</div></button>';
    }).join("");
    $$(".thread",$("#tl")).forEach(b=>b.onclick=()=>{
      activeThread=b.dataset.t; const t=threads.find(x=>x.clubId===activeThread);
      if(t&&t.unread){ t.unread=false; STORE.markRead&&STORE.markRead(activeThread); renderNav(); }
      $("#mc").classList.add("viewing"); paintList(); paintConvo();
    });
  }
  function paintConvo(){
    const t=threads.find(x=>x.clubId===activeThread), c=BY_ID[t.clubId];
    $("#cv").innerHTML='<div class="convo-head"><div style="display:flex;gap:10px;align-items:center;min-width:0">'+mono(c)
      +'<div style="min-width:0"><div style="font-weight:600">'+esc(c.name)+'</div><div class="xs dim">'+(c.sponsors.length?"Faculty sponsor":"Student leaders")+'</div></div></div>'
      +'<div style="display:flex;gap:8px"><a class="btn btn-sm" href="#/club/'+c.id+'">Club</a><button class="btn btn-sm" id="back" style="display:none">Back</button></div></div>'
      +'<div class="bubbles" id="bb">'+(t.msgs.length?t.msgs.map(m=>'<div class="bub '+(m.from==="me"?"me":"")+'"><div class="who">'+(m.from==="me"?"You":(c.sponsors.length?"Faculty sponsor":"Student leader"))+' \u00b7 '+shortTime(m.t)+'</div><div class="txt">'+esc(m.text)+'</div></div>').join("")
        :'<p class="small dim">Ask when the next meeting is, or what to bring.</p>')+'</div>'
      +'<div class="composer"><textarea id="ta" rows="1" placeholder="Write a message" aria-label="Message"></textarea><button class="btn btn-pri" id="send">Send</button></div>';
    const bb=$("#bb"); bb.scrollTop=bb.scrollHeight;
    if(window.innerWidth<=900){ const b=$("#back"); b.style.display=""; b.onclick=()=>$("#mc").classList.remove("viewing"); }
    const ta=$("#ta"); ta.oninput=()=>{ta.style.height="auto";ta.style.height=Math.min(120,ta.scrollHeight)+"px";};
    const send=async()=>{
      const txt=ta.value.trim(); if(!txt) return;
      const b=$("#send"); b.disabled=true;
      try{ const res=await STORE.sendMessage(c.id,txt); S.threads=res.threads; activeThread=c.id; toast(res.toast||"Sent."); router(); }
      catch(err){ toast(String(err&&err.message||err),true); b.disabled=false; }
    };
    $("#send").onclick=send; ta.onkeydown=e=>{ if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();send();} };
  }
  function shortTime(ts){
    const d=new Date(ts), now=new Date();
    if(d.toDateString()===now.toDateString()) return d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
    return ((now-d)/864e5<7)?d.toLocaleDateString([],{weekday:"short"}):d.toLocaleDateString([],{month:"short",day:"numeric"});
  }
}

/* ================= ADMIN (sponsors) ================= */
function viewAdmin(v){
  const head='<section class="band band-slim"><div class="band-in"><div class="eyebrow">Sponsors</div><h1>Participation requests</h1></div></section>';
  if(!STORE.scope.length){ v.innerHTML=head+'<div class="wrap"><div class="empty"><h3>Not available</h3><p style="margin:0">Only listed sponsors and administrators can review requests.</p></div></div>'; return; }
  v.innerHTML=head+'<div class="wrap"><div class="clublist" id="queue">'+skeletonRows(3)+'</div></div>';
  STORE.reviewQueue().then(paint).catch(err=>{$("#queue").innerHTML='<div class="notice">'+esc(String(err&&err.message||err))+'</div>';});
  function paint(q){
    if(!q.length){ $("#queue").innerHTML='<div class="empty"><h3>All caught up</h3><p style="margin:0">New requests show up here.</p></div>'; return; }
    $("#queue").innerHTML=q.map(r=>{ const c=BY_ID[r.clubId]||{name:r.clubName,color:"#14507E"};
      return '<div class="crow" style="cursor:default">'+(c.id?mono(c):"")+'<div style="min-width:0"><div class="cat">'+esc(c.name)+'</div><div class="cname">'+esc(r.name)+'</div>'
        +(r.note?'<div class="cline">'+esc(r.note)+'</div>':"")+'<span class="meta"><span>'+esc(String(r.at))+'</span></span></div>'
        +'<div class="cright" style="flex-direction:row"><button class="btn btn-sm btn-go" data-id="'+esc(r.id)+'" data-d="approved">Approve</button><button class="btn btn-sm" data-id="'+esc(r.id)+'" data-d="declined">Decline</button></div></div>'; }).join("");
    $$("#queue button[data-id]").forEach(b=>b.onclick=async()=>{ b.disabled=true;
      try{ paint(await STORE.review(b.dataset.id,b.dataset.d)); toast("Request "+b.dataset.d+"."); }catch(err){ toast(String(err&&err.message||err),true); b.disabled=false; } });
  }
}

  +'<p class="notice">Draft for review. Not reviewed or approved by Fairfax County Public Schools.</p>'

/* ================= ACCOUNT MENU ================= */
const menu=$("#acctMenu"), avatarBtn=$("#avatarBtn");
function drawMenu(){
  menu.innerHTML='<h4>'+(STORE.signedIn?"Signed in":"Not signed in")+'</h4>'
    +(STORE.canRename?'<div style="padding:0 10px"><input id="nameIn" placeholder="Your name" value="'+esc(STORE.name())+'"></div>'
      :'<div style="padding:0 10px 6px;font-size:14px">'+esc(STORE.name()||"School account")+'</div>')
    +'<hr><a href="#/my">My Clubs</a><a href="#/match">Seahawk Match</a>'+(STORE.scope.length?'<a href="#/admin">Participation requests</a>':"")
    +'<hr><button id="themeBtn"></button>'+(STORE.reset?'<button id="resetBtn">Reset saved data</button>':"")
    +'<hr><a href="'+esc(STORE.links.privacy)+'">Privacy</a><a href="'+esc(STORE.links.terms)+'">Terms</a>';
  const t=document.documentElement.getAttribute("data-theme");
  $("#themeBtn").textContent=t==="dark"?"Light theme":t==="light"?"Match system theme":"Dark theme";
  $("#themeBtn").onclick=()=>{
    const cur=document.documentElement.getAttribute("data-theme"), next=cur==="dark"?"light":cur==="light"?null:"dark";
    if(next) document.documentElement.setAttribute("data-theme",next); else document.documentElement.removeAttribute("data-theme");
    try{ next?localStorage.setItem("slhs-theme",next):localStorage.removeItem("slhs-theme"); }catch(e){}
    drawMenu();
  };
  if($("#nameIn")) $("#nameIn").oninput=e=>{ STORE.setName(e.target.value); renderNav(); };
  if($("#resetBtn")) $("#resetBtn").onclick=async()=>{ await STORE.reset(); S.states={}; S.threads=STORE.threads(); S.match=null; MQ=null; closeMenu(); toast("Saved data cleared."); router(); };
}
function openMenu(){ drawMenu(); menu.hidden=false; avatarBtn.setAttribute("aria-expanded","true"); }
function closeMenu(){ menu.hidden=true; avatarBtn.setAttribute("aria-expanded","false"); }
avatarBtn.onclick=e=>{ e.stopPropagation(); menu.hidden?openMenu():closeMenu(); };
document.addEventListener("click",e=>{ if(!menu.hidden&&!menu.contains(e.target)) closeMenu(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeMenu(); });
menu.addEventListener("click",e=>{ if(e.target.tagName==="A") closeMenu(); });

/* ================= BOOT ================= */
try{ const th=localStorage.getItem("slhs-theme"); if(th) document.documentElement.setAttribute("data-theme",th); }catch(e){}
if(STORE.initialHash && (!location.hash||location.hash==="#"||location.hash==="#/")) location.hash=STORE.initialHash; /* hashchange renders */
else router();

</script>
